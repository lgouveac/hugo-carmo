  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co",CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json";
    const LANG=(/^\/en(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get('lang')==='en')?'en':'pt';
    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    document.documentElement.lang=LANG==='en'?'en':'pt-BR';
    document.getElementById('yr').textContent=new Date().getFullYear();
    document.getElementById('canonical').href='https://www.hugocarmo.com.br'+(LANG==='en'?'/en/provador':'/provador');
    const params=new URLSearchParams(location.search);
    function chrome(c){
      const home=LANG==='en'?'/en':'/';
      const lh=document.getElementById('lnk-home'),lf=document.getElementById('lnk-foot'); if(lh)lh.href=home; if(lf)lf.href=home;
      const P=LANG==='en'
        ?[['/en','Photography'],['/en/temas','Themes'],['/en/provador','AI try-on'],['/en/cicloviagens','Journeys'],['/en/loja','Shop'],['/en/fotolivros','Photo books'],['/en/blog','Travel diary'],['/en/sobre','About'],['/en/faq','FAQ']]
        :[['/','Fotografias'],['/temas','Temas'],['/provador','Provador IA'],['/cicloviagens','Cicloviagens'],['/loja','Loja'],['/fotolivros','Fotolivros'],['/blog','Diário'],['/sobre','Sobre'],['/faq','FAQ']];
      const cur=(location.pathname.replace(/\/+$/,'')||'/');
      document.getElementById('drawer-nav').innerHTML=P.map(([h,l])=>`<a href="${h}" class="px-3 py-3 rounded-lg text-lg ${cur===h.replace(/\/+$/,'')?'bg-white/10 text-white':'text-white/80 hover:bg-white/5 hover:text-white'} transition">${l}</a>`).join('');
      const lang=LANG==='en'?'<a href="/" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">PT</a>':'<a href="/en" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">EN</a>';
      document.getElementById('drawer-foot').innerHTML=`<div class="flex items-center gap-3"><a href="${c.contact?.instagram_url||'#'}" target="_blank" rel="noopener" aria-label="Instagram" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a><a href="https://wa.me/${c.contact?.whatsapp||''}" target="_blank" rel="noopener" aria-label="WhatsApp" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><i data-lucide="message-circle" class="w-4 h-4"></i></a></div>${lang}`;
      const mb=document.getElementById('menu-btn'),dr=document.getElementById('drawer'),bg=document.getElementById('drawer-bg');
      const op=()=>{dr.classList.remove('translate-x-full');bg.classList.remove('opacity-0','pointer-events-none');document.body.style.overflow='hidden';};
      const cl=()=>{dr.classList.add('translate-x-full');bg.classList.add('opacity-0','pointer-events-none');document.body.style.overflow='';};
      mb.onclick=op;document.getElementById('drawer-close').onclick=cl;bg.onclick=cl;document.addEventListener('keydown',e=>{if(e.key==='Escape')cl();});
    }
    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const wa=c.contact?.whatsapp||'';
      const TIPO=LANG==='en'?{blusa:'Tee',print:'Print',bandeira:'Flag',prancha:'Surfboard',ambiente:'Interiors (architects)'}:{blusa:'Blusa',print:'Quadro',bandeira:'Bandeira',prancha:'Prancha de surf',ambiente:'Ambientes (arquitetos)'};
      const MSG=LANG==='en'?{blusa:'Hi, I want the tee with the photo ',print:'Hi, I want the print with the photo ',bandeira:'Hi, I want the flag with the photo ',prancha:'Hi, I want the surfboard with the photo ',ambiente:'Hi, I\'m an architect/designer and want the print for a project with the photo '}:{blusa:'Olá, quero a blusa com a foto ',print:'Olá, quero o quadro com a foto ',bandeira:'Olá, quero a bandeira com a foto ',prancha:'Olá, quero a prancha de surf com a foto ',ambiente:'Olá, sou arquiteto(a)/designer e quero o quadro para um projeto com a foto '};
      const ROOM=LANG==='en'?{sala:'Living room',quarto:'Bedroom',escritorio:'Office',jantar:'Dining room',hotel:'Hotel lobby'}:{sala:'Sala',quarto:'Quarto',escritorio:'Escritório',jantar:'Sala de jantar',hotel:'Lobby de hotel'};
      let selRoom='sala';
      const T={ title:LANG==='en'?'AI try-on':'Provador IA', badge:LANG==='en'?'AI preview':'Provador com IA',
        sub:LANG==='en'?'Pick a product and a photo — AI shows you the result before you order.':'Escolha um produto e uma foto — a IA mostra o resultado antes de você pedir.',
        step:LANG==='en'?'Now tap a photo to see it':'Agora toque numa foto para ver o resultado',
        buy:LANG==='en'?'I want this':'Quero esta', genby:LANG==='en'?'Original photo · AI-made scene':'Foto original · cenário por IA' };
      document.getElementById('h1').textContent=T.title; document.getElementById('t').textContent=T.title+' — Hugo Carmo';
      document.getElementById('badge').textContent=T.badge; document.getElementById('sub').textContent=T.sub; document.getElementById('step').textContent=T.step;
      document.getElementById('r-buylbl').textContent=T.buy;
      const fts=(c.photos||[]).filter(p=>p.section==='fotografias').sort((a,b)=>a.order-b.order);
      const capOf=p=>(LANG==='en'&&p.caption_en)?p.caption_en:(p.caption||'');
      // tipo pills
      const order=['blusa','print','bandeira','prancha','ambiente'];
      let selTipo=order.includes(params.get('tipo'))?params.get('tipo'):'blusa';
      if(ROOM[params.get('room')]) selRoom=params.get('room');
      let selPath=null, selCap='';
      const pillCls=on=>`px-4 py-1.5 rounded-full border border-white/20 text-sm ${on?'bg-white text-black':'text-white/80 hover:bg-white/10'} transition`;
      const renderRooms=()=>{ const w=document.getElementById('room-wrap'); const on=selTipo==='ambiente';
        w.classList.toggle('hidden',!on); w.classList.toggle('flex',on);
        document.getElementById('room-lbl').textContent=LANG==='en'?'Room':'Cômodo';
        document.getElementById('room-pills').innerHTML=Object.keys(ROOM).map(r=>`<button data-room="${r}" class="${pillCls(r===selRoom)}">${esc(ROOM[r])}</button>`).join('');
        document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{ selRoom=b.dataset.room; renderRooms(); reset(); })); };
      const renderPills=()=>{ document.getElementById('tipo-pills').innerHTML=order.map(tp=>`<button data-tp="${tp}" class="${pillCls(tp===selTipo)}">${esc(TIPO[tp])}</button>`).join('');
        document.querySelectorAll('[data-tp]').forEach(b=>b.addEventListener('click',()=>{ selTipo=b.dataset.tp; renderPills(); renderRooms(); reset(); })); };
      // trocar de tag NÃO regenera: limpa e pede uma nova foto, do zero
      function reset(){ selPath=null; selCap=''; curUrl=''; clearInterval(msgTimer); closeEditor();
        document.getElementById('result').classList.add('hidden');
        document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('ring-2','ring-white'));
        document.getElementById('step').textContent=T.step; }
      let curUrl='';
      renderPills(); renderRooms();
      // grid
      document.getElementById('grid').innerHTML=fts.map(p=>`<button class="thumb group relative rounded-lg overflow-hidden aspect-square bg-white/5" data-path="${esc(p.path)}" data-cap="${esc(capOf(p))}"><img src="${imgUrl(p.path)}" alt="${esc(capOf(p))}" loading="lazy" class="w-full h-full object-cover transition group-hover:scale-105"></button>`).join('');
      const waLink=()=>"https://api.whatsapp.com/send/?phone="+wa+"&text="+encodeURIComponent(MSG[selTipo]+'"'+selCap+'"'+(selTipo==='ambiente'?' ('+ROOM[selRoom]+')':'')+(ED.on?' ('+GARM[ED.g]+', '+CORN[ED.cor]+') '+shareUrl():''))+"&type=phone_number&app_absent=0";
      const MSGS=LANG==='en'?['Setting up the canvas…','Printing the artwork…','Almost there…']:['Preparando a arte…','Aplicando no produto…','Quase lá…'];
      let msgTimer=null;
      function generate(path, cap){
        if(selTipo==='blusa') return openEditor(path, cap);
        closeEditor();
        selPath=path; selCap=cap;
        const R=document.getElementById('result'); R.classList.remove('hidden');
        const img=document.getElementById('r-img'), load=document.getElementById('r-load'), err=document.getElementById('r-err');
        img.classList.add('hidden'); err.classList.add('hidden'); err.classList.remove('flex'); load.classList.remove('hidden'); load.classList.add('flex');
        document.getElementById('r-thumb').src=imgUrl(path);
        document.getElementById('r-cap').textContent=cap; document.getElementById('r-tag').textContent=TIPO[selTipo]+(selTipo==='ambiente'?' · '+ROOM[selRoom]:'')+' · '+T.genby;
        ['r-buy','r-share','r-dl'].forEach(id=>document.getElementById(id).classList.add('hidden'));
        R.scrollIntoView({behavior:'smooth',block:'start'});
        let mi=0; document.getElementById('r-msg').textContent=MSGS[0]; clearInterval(msgTimer); msgTimer=setInterval(()=>{ mi=(mi+1)%MSGS.length; document.getElementById('r-msg').textContent=MSGS[mi]; },3500);
        fetch('/api/mockup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path, tipo:selTipo, room:selRoom})})
          .then(async r=>{ const j=await r.json(); if(!r.ok) throw new Error(j.error||'erro'); return j; })
          .then(j=>{ if(selPath!==path) return; clearInterval(msgTimer); showResult(j.url);
            try{ gtag&&gtag('event','mockup_view',{tipo:selTipo,room:selTipo==='ambiente'?selRoom:'',cached:!!j.cached}); }catch(e){} })
          .catch(e=>{ if(selPath!==path) return; clearInterval(msgTimer); load.classList.add('hidden'); load.classList.remove('flex');
            err.classList.remove('hidden'); err.classList.add('flex');
            err.innerHTML=`<i data-lucide="alert-triangle" class="w-6 h-6 text-white/60"></i><p class="text-sm text-white/70">${esc(e.message)}</p><p class="text-xs text-white/40">${LANG==='en'?'Try another photo or come back soon.':'Tente outra foto ou volte em instantes.'}</p>`;
            if(window.lucide)lucide.createIcons(); });
      }
      // ---- resultado: mostrar + compartilhar + baixar ----
      const idOf=u=>(String(u).split('/').pop()||'').replace(/\.(png|jpg).*$/,'');
      const shareUrl=()=>location.origin+'/p/'+idOf(curUrl)+(LANG==='en'?'?lang=en':'');
      function showResult(url){
        curUrl=url;
        const img=document.getElementById('r-img'), load=document.getElementById('r-load');
        load.classList.add('hidden'); load.classList.remove('flex');
        img.src=url; img.alt=selCap; img.onload=()=>img.classList.remove('hidden');
        const buy=document.getElementById('r-buy'); buy.href=waLink();
        ['r-buy','r-share','r-dl'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
      }
      document.getElementById('r-sharelbl').textContent=LANG==='en'?'Share':'Compartilhar';
      document.getElementById('r-dllbl').textContent=LANG==='en'?'Download':'Baixar';
      const flash=(id,txt)=>{ const el=document.getElementById(id), old=el.textContent; el.textContent=txt; setTimeout(()=>el.textContent=old,2200); };
      document.getElementById('r-share').addEventListener('click', async ()=>{
        if(ED.on) edSave();
        if(!curUrl) return;
        const url=shareUrl(), title=(LANG==='en'?'Look what I created with ':'Olha o que eu criei com ')+'Hugo Carmo — '+selCap;
        try{ gtag&&gtag('event','mockup_share',{tipo:selTipo}); }catch(e){}
        try{
          if(navigator.share){
            try{ const blob=ED.on?await new Promise(r=>{ draw(false); cv.toBlob(b=>{ draw(); r(b); },'image/jpeg',0.92); }):await (await fetch(curUrl)).blob(); const f=new File([blob],idOf(curUrl)+'.jpg',{type:blob.type||'image/jpeg'});
              if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title,text:title+' '+url}); return; } }catch(e){ if(e.name==='AbortError') return; }
            await navigator.share({title,text:title,url}); return;
          }
        }catch(e){ if(e.name==='AbortError') return; }
        try{ await navigator.clipboard.writeText(url); flash('r-sharelbl',LANG==='en'?'Link copied!':'Link copiado!'); }
        catch(e){ prompt(LANG==='en'?'Copy the link:':'Copie o link:',url); }
      });
      document.getElementById('r-dl').addEventListener('click', async ()=>{
        if(ED.on) return edDownload();
        if(!curUrl) return;
        try{ const blob=await (await fetch(curUrl)).blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hugo-carmo-'+idOf(curUrl)+(/\.png/.test(curUrl)?'.png':'.jpg'); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
        catch(e){ window.open(curUrl,'_blank'); }
      });
      document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{
        document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('ring-2','ring-white'));
        b.classList.add('ring-2','ring-white');
        generate(b.dataset.path, b.dataset.cap);
      }));
      // ---- editor da blusa: a foto original sobre a peça (arrastar, aumentar, peça, cor, estampa cheia) ----
      // Mesma composição do servidor (api/_provador.js renderShirt): fundo → sombra → [cor | foto] × dobras, recortado pela máscara.
      const GARM=LANG==='en'?{camiseta:'T-shirt',oversized:'Oversized',regata:'Tank top','manga-longa':'Long sleeve',moletom:'Sweatshirt',capuz:'Hoodie'}:{camiseta:'Camiseta',oversized:'Oversized',regata:'Regata','manga-longa':'Manga longa',moletom:'Moletom',capuz:'Moletom c/ capuz'};
      const CORES={branco:'#f4f3ef',off:'#e6dece',areia:'#c8b393',cinza:'#8e8e8c',marinho:'#1f2940',preto:'#262626'};
      const CORN=LANG==='en'?{branco:'White',off:'Off-white',areia:'Sand',cinza:'Grey',marinho:'Navy',preto:'Black'}:{branco:'Branco',off:'Off-white',areia:'Areia',cinza:'Cinza',marinho:'Marinho',preto:'Preto'};
      const MODES=LANG==='en'?{peito:'Chest print',cheia:'All-over print'}:{peito:'Estampa no peito',cheia:'Estampa cheia'};
      const SHIRT_BG='rgb(236,234,229)', SHADOW_DY=10, PECA_V=1; // PECA_V = versão das peças em _provador.js
      const ED={on:false,g:'camiseta',cor:'branco',mode:'peito',cx:512,cy:400,w:300,photo:null,A:null,cache:{},tok:0};
      const cv=document.getElementById('ed-cv'), ctx=cv.getContext('2d'), gc=document.createElement('canvas'), g2=gc.getContext('2d');
      const loadOnce=src=>new Promise((ok,no)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>ok(i); i.onerror=no; i.src=src; });
      const loadImg=async src=>{ for(let k=0;;k++){ try{ return await loadOnce(k?src+(src.includes('?')?'&':'?')+'r='+k:src); }catch(e){ if(k>=2) throw e; await new Promise(r=>setTimeout(r,700*(k+1))); } } };
      async function pecaAssets(g){
        if(ED.cache[g]) return ED.cache[g];
        const u=k=>c.bucket_base+'/templates/peca-'+g+'.v'+PECA_V+'-'+k+'.png';
        const [mask,shade,shadow]=await Promise.all(['mask','shade','shadow'].map(k=>loadImg(u(k))));
        const W=mask.naturalWidth,H=mask.naturalHeight, t=document.createElement('canvas'); t.width=W; t.height=H;
        const tc=t.getContext('2d'); tc.drawImage(mask,0,0); const d=tc.getImageData(0,0,W,H).data, A=new Uint8Array(W*H);
        for(let i=0;i<W*H;i++) A[i]=d[i*4+3];
        return ED.cache[g]={mask,shade,shadow,W,H,A};
      }
      function defaults(a,mode){ // igual a shirtDefaults() no servidor
        const {A,W,H}=a, asp=ED.photo.naturalWidth/ED.photo.naturalHeight; let x0=W,y0=H,x1=0,y1=0;
        for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(A[y*W+x]>128){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
        const bw=x1-x0+1, bh=y1-y0+1, cx=Math.round(x0+bw/2);
        if(mode==='cheia') return {cx, cy:Math.round(y0+bh/2), w:Math.round(Math.max(bw,bh*asp))};
        const ry=Math.round(y0+bh*0.45); let l=cx,r=cx;
        while(l>0&&A[ry*W+l-1]>128) l--; while(r<W-1&&A[ry*W+r+1]>128) r++;
        const w=Math.round((r-l+1)*(asp>=1?0.62:0.5)), h=w/asp;
        return {cx, cy:Math.round(y0+bh*0.2+h/2), w};
      }
      const clampEd=()=>{ ED.cx=Math.min(1024,Math.max(0,Math.round(ED.cx))); ED.cy=Math.min(1024,Math.max(0,Math.round(ED.cy))); ED.w=Math.min(2400,Math.max(40,Math.round(ED.w))); };
      const pRect=()=>{ const pw=ED.w, ph=ED.w*ED.photo.naturalHeight/ED.photo.naturalWidth; return {x:ED.cx-pw/2,y:ED.cy-ph/2,w:pw,h:ph}; };
      const handlePt=()=>{ const r=pRect(), a=ED.a; return {x:Math.min(r.x+r.w,a.W-26),y:Math.min(r.y+r.h,a.H-26)}; };
      function draw(overlay=true){
        const a=ED.a; if(!a||!ED.photo) return;
        if(cv.width!==a.W){ cv.width=gc.width=a.W; cv.height=gc.height=a.H; }
        const r=pRect();
        g2.globalCompositeOperation='source-over'; g2.fillStyle=CORES[ED.cor]; g2.fillRect(0,0,a.W,a.H);
        g2.imageSmoothingQuality='high'; g2.drawImage(ED.photo,r.x,r.y,r.w,r.h);
        g2.globalCompositeOperation='multiply'; g2.drawImage(a.shade,0,0);
        g2.globalCompositeOperation='destination-in'; g2.drawImage(a.mask,0,0);
        ctx.globalCompositeOperation='source-over'; ctx.fillStyle=SHIRT_BG; ctx.fillRect(0,0,a.W,a.H);
        ctx.drawImage(a.shadow,0,SHADOW_DY); ctx.drawImage(gc,0,0);
        if(overlay){
          ctx.save(); ctx.setLineDash([10,8]); ctx.lineWidth=2; ctx.strokeStyle='rgba(20,20,20,.55)'; ctx.strokeRect(r.x,r.y,r.w,r.h);
          const h=handlePt(); ctx.setLineDash([]); ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=3;
          ctx.beginPath(); ctx.arc(h.x,h.y,16,0,Math.PI*2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(h.x-6,h.y+6); ctx.lineTo(h.x+6,h.y-6); ctx.moveTo(h.x+1,h.y-6); ctx.lineTo(h.x+6,h.y-6); ctx.lineTo(h.x+6,h.y-1); ctx.moveTo(h.x-6,h.y+1); ctx.lineTo(h.x-6,h.y+6); ctx.lineTo(h.x-1,h.y+6); ctx.stroke();
          ctx.restore();
        }
        document.getElementById('ed-size').value=ED.w;
        curUrl=c.bucket_base+'/mockups-v2/'+edId()+'.jpg';
        document.getElementById('r-tag').textContent=TIPO.blusa+' · '+GARM[ED.g]+' · '+CORN[ED.cor]+' · '+(LANG==='en'?'Original photo':'Foto original');
        document.getElementById('r-buy').href=waLink();
      }
      const slugOf=p=>p.replace(/\.[a-z0-9]+$/i,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
      const edId=()=>slugOf(selPath)+'__blusa-'+ED.g+'-'+ED.cor+'-'+ED.cx+'-'+ED.cy+'-'+ED.w;
      let edRaf=0; const redraw=()=>{ clampEd(); cancelAnimationFrame(edRaf); edRaf=requestAnimationFrame(()=>draw()); };
      // render no servidor (mesma conta) pra criação ter link próprio /p/:id; o id é determinístico, então dá pra compartilhar na hora
      let edSaved='';
      function edSave(){ const id=edId(); if(edSaved===id) return; edSaved=id;
        fetch('/api/mockup',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({path:selPath,tipo:'blusa',garment:ED.g,color:ED.cor,cx:ED.cx,cy:ED.cy,w:ED.w})}).catch(()=>{ edSaved=''; });
        try{ gtag&&gtag('event','mockup_view',{tipo:'blusa',garment:ED.g,color:ED.cor}); }catch(e){} }
      function edDownload(){ draw(false); cv.toBlob(b=>{ draw(); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='hugo-carmo-'+edId()+'.jpg'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); },'image/jpeg',0.92); }
      async function setGarment(g){
        const tok=++ED.tok, prev=ED.g; ED.g=g; renderEdCtrls(); cv.style.opacity=.45;
        try{ const a=await pecaAssets(g); if(tok!==ED.tok) return; ED.a=a; Object.assign(ED,defaults(a,ED.mode)); edShow(); redraw(); }
        catch(e){ if(tok!==ED.tok) return; ED.g=prev; renderEdCtrls(); cv.style.opacity=1; edToast(LANG==='en'?'Could not load this garment — try again.':'Não deu pra carregar essa peça — tente de novo.'); }
      }
      const edShow=()=>{ const err=document.getElementById('r-err'); err.classList.add('hidden'); err.classList.remove('flex'); cv.classList.remove('hidden'); cv.style.opacity=1; };
      function edToast(msg){ const h=document.querySelector('#ed-hint span'), old=h.dataset.t||h.textContent; h.dataset.t=old; h.textContent=msg; h.parentElement.classList.add('text-amber-300'); setTimeout(()=>{ h.textContent=old; h.parentElement.classList.remove('text-amber-300'); },3500); }
      function edError(){ const err=document.getElementById('r-err'); cv.classList.add('hidden'); err.classList.remove('hidden'); err.classList.add('flex');
        err.innerHTML=`<p class="text-sm text-white/70">${LANG==='en'?'Could not load the garment. Try again soon.':'Não deu pra carregar a peça. Tente de novo em instantes.'}</p>`; }
      function renderEdCtrls(){
        const pc=on=>`px-3.5 py-1.5 rounded-full border border-white/20 text-sm ${on?'bg-white text-black':'text-white/80 hover:bg-white/10'} transition`;
        document.getElementById('ed-mode').innerHTML=Object.keys(MODES).map(m=>`<button data-em="${m}" class="${pc(m===ED.mode)}">${MODES[m]}</button>`).join('');
        document.getElementById('ed-g').innerHTML=Object.keys(GARM).map(g=>`<button data-eg="${g}" class="${pc(g===ED.g)}">${GARM[g]}</button>`).join('');
        document.getElementById('ed-c').innerHTML=Object.keys(CORES).map(k=>`<button data-ec="${k}" title="${CORN[k]}" aria-label="${CORN[k]}" class="w-8 h-8 rounded-full border border-white/30 ${k===ED.cor?'ring-2 ring-white ring-offset-2 ring-offset-black':''}" style="background:${CORES[k]}"></button>`).join('');
        document.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{ ED.mode=b.dataset.em; renderEdCtrls(); if(ED.a){ Object.assign(ED,defaults(ED.a,ED.mode)); redraw(); } });
        document.querySelectorAll('[data-eg]').forEach(b=>b.onclick=()=>setGarment(b.dataset.eg));
        document.querySelectorAll('[data-ec]').forEach(b=>b.onclick=()=>{ ED.cor=b.dataset.ec; renderEdCtrls(); redraw(); });
      }
      document.getElementById('ed-l-mode').textContent=LANG==='en'?'Print':'Estampa';
      document.getElementById('ed-l-g').textContent=LANG==='en'?'Garment':'Peça';
      document.getElementById('ed-l-c').textContent=LANG==='en'?'Colour':'Cor';
      document.querySelector('#ed-hint span').textContent=LANG==='en'?'Drag the photo to move it · pull the corner (or pinch) to resize':'Arraste a foto para mover · puxe o canto (ou use dois dedos) para aumentar';
      document.getElementById('ed-size').addEventListener('input',e=>{ ED.w=+e.target.value; redraw(); });
      // gestos: 1 dedo/mouse = mover (ou redimensionar pelo canto); 2 dedos = pinça; roda do mouse = zoom
      const ptrs=new Map(); let gest=null;
      const toCv=e=>{ const b=cv.getBoundingClientRect(); return {x:(e.clientX-b.left)*cv.width/b.width, y:(e.clientY-b.top)*cv.height/b.height}; };
      const startGesture=()=>{ const pts=[...ptrs.values()];
        if(pts.length>=2){ const [a,b]=pts; gest={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,w:ED.w,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:ED.cx,cy:ED.cy}; return; }
        const p=pts[0], h=handlePt();
        gest=Math.hypot(p.x-h.x,p.y-h.y)<44 ? {type:'resize',d:Math.hypot(p.x-ED.cx,p.y-ED.cy)||1,w:ED.w} : {type:'move',x:p.x,y:p.y,cx:ED.cx,cy:ED.cy}; };
      cv.addEventListener('pointerdown',e=>{ if(!ED.a) return; cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,toCv(e)); startGesture(); e.preventDefault(); });
      cv.addEventListener('pointermove',e=>{
        if(!ptrs.has(e.pointerId)){ if(ED.a){ const p=toCv(e), h=handlePt(); cv.style.cursor=Math.hypot(p.x-h.x,p.y-h.y)<44?'nwse-resize':'move'; } return; }
        ptrs.set(e.pointerId,toCv(e)); const pts=[...ptrs.values()];
        if(gest.type==='pinch'&&pts.length>=2){ const [a,b]=pts; ED.w=gest.w*Math.hypot(a.x-b.x,a.y-b.y)/gest.d; ED.cx=gest.cx+(a.x+b.x)/2-gest.mx; ED.cy=gest.cy+(a.y+b.y)/2-gest.my; }
        else if(gest.type==='resize'){ const p=pts[0]; ED.w=gest.w*Math.hypot(p.x-ED.cx,p.y-ED.cy)/gest.d; }
        else if(gest.type==='move'){ const p=pts[0]; ED.cx=gest.cx+p.x-gest.x; ED.cy=gest.cy+p.y-gest.y; }
        redraw(); });
      const endPtr=e=>{ if(!ptrs.delete(e.pointerId)) return; if(ptrs.size) startGesture(); else gest=null; };
      cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
      cv.addEventListener('wheel',e=>{ if(!ED.a) return; e.preventDefault(); ED.w*=Math.exp(-e.deltaY*0.0015); redraw(); },{passive:false});
      async function openEditor(path, cap){
        selPath=path; selCap=cap; ED.on=true; edSaved='';
        const R=document.getElementById('result'); R.classList.remove('hidden');
        const img=document.getElementById('r-img'), load=document.getElementById('r-load'), err=document.getElementById('r-err');
        img.classList.add('hidden'); err.classList.add('hidden'); err.classList.remove('flex'); load.classList.remove('hidden'); load.classList.add('flex');
        document.getElementById('r-thumb').src=imgUrl(path); document.getElementById('r-msg').textContent=MSGS[0];
        document.getElementById('r-cap').textContent=cap;
        document.getElementById('ed').classList.remove('hidden'); renderEdCtrls();
        R.scrollIntoView({behavior:'smooth',block:'start'});
        const tok=++ED.tok;
        try{ const [ph,a]=await Promise.all([loadImg(imgUrl(path)),pecaAssets(ED.g)]); if(tok!==ED.tok||selPath!==path) return;
          ED.photo=ph; ED.a=a; Object.assign(ED,defaults(a,ED.mode)); clampEd();
          load.classList.add('hidden'); load.classList.remove('flex'); edShow(); draw();
          ['r-buy','r-share','r-dl'].forEach(id=>document.getElementById(id).classList.remove('hidden')); }
        catch(e){ if(tok===ED.tok){ load.classList.add('hidden'); load.classList.remove('flex'); edError(); } }
        if(window.lucide) lucide.createIcons();
      }
      function closeEditor(){ ED.on=false; ED.tok++; cv.classList.add('hidden'); document.getElementById('ed').classList.add('hidden'); }
      document.getElementById('r-buy').addEventListener('click',()=>{ if(ED.on) edSave(); });
      // ---- abrir uma criação compartilhada (?m=<id>) ----
      const mId=params.get('m');
      if(mId && /^[a-z0-9-]+__[a-z0-9-]+$/.test(mId)){
        const [pslug,variant]=mId.split('__');
        if(variant.startsWith('ambiente-')&&ROOM[variant.slice(9)]){ selTipo='ambiente'; selRoom=variant.slice(9); }
        else if(order.includes(variant)) selTipo=variant;
        else if(variant.startsWith('blusa-')) selTipo='blusa';
        renderPills(); renderRooms();
        const sl=p=>p.replace(/\.[a-z0-9]+$/i,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        const ph=(c.photos||[]).find(p=>sl(p.path)===pslug);
        selPath=ph?ph.path:null; selCap=ph?capOf(ph):'';
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('r-cap').textContent=selCap;
        document.getElementById('r-tag').textContent=TIPO[selTipo]+(selTipo==='ambiente'?' · '+ROOM[selRoom]:'')+' · '+T.genby;
        const ri=document.getElementById('r-img'), old=c.bucket_base+'/mockups/'+mId+'.png';
        ri.onerror=()=>{ ri.onerror=null; curUrl=old; ri.src=old; }; // criações antigas (antes da v2)
        showResult(c.bucket_base+'/mockups-v2/'+mId+'.jpg');
        document.getElementById('step').textContent=LANG==='en'?'Want your own? Pick a product and a photo below.':'Quer criar o seu? Escolha um produto e uma foto abaixo.';
      }
      chrome(c); if(window.lucide)lucide.createIcons();
    }).catch(()=>{ chrome({}); if(window.lucide)lucide.createIcons(); });
  </script>
