  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co",CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json";
    const LANG=(/^\/en(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get('lang')==='en')?'en':'pt';
    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    document.documentElement.lang=LANG==='en'?'en':'pt-BR';
    document.getElementById('yr').textContent=new Date().getFullYear();
    document.getElementById('canonical').href='https://www.hugocarmo.com.br'+(LANG==='en'?'/en/provador':'/provador');
    const params=new URLSearchParams(location.search);
    function chrome(c){
      const home=LANG==='en'?'/en':'/';
      const lh=document.getElementById('lnk-home'),lf=document.getElementById('lnk-foot'); if(lh)lh.href=home; if(lf)lf.href=home;
      const P=LANG==='en'
        ?[['/en','Photography'],['/en/temas','Themes'],['/en/provador','AI try-on'],['/en/cicloviagens','Journeys'],['/en/loja','Shop'],['/en/fotolivros','Photo books'],['/en/blog','Travel diary'],['/en/sobre','About'],['/en/faq','FAQ']]
        :[['/','Fotografias'],['/temas','Temas'],['/provador','Provador IA'],['/cicloviagens','Cicloviagens'],['/loja','Loja'],['/fotolivros','Fotolivros'],['/blog','Diário'],['/sobre','Sobre'],['/faq','FAQ']];
      const cur=(location.pathname.replace(/\/+$/,'')||'/');
      document.getElementById('drawer-nav').innerHTML=P.map(([h,l])=>`<a href="${h}" class="px-3 py-3 rounded-lg text-lg ${cur===h.replace(/\/+$/,'')?'bg-white/10 text-white':'text-white/80 hover:bg-white/5 hover:text-white'} transition">${l}</a>`).join('');
      const lang=LANG==='en'?'<a href="/" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">PT</a>':'<a href="/en" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">EN</a>';
      document.getElementById('drawer-foot').innerHTML=`<div class="flex items-center gap-3"><a href="${c.contact?.instagram_url||'#'}" target="_blank" rel="noopener" aria-label="Instagram" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a><a href="https://wa.me/${c.contact?.whatsapp||''}" target="_blank" rel="noopener" aria-label="WhatsApp" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><i data-lucide="message-circle" class="w-4 h-4"></i></a></div>${lang}`;
      const mb=document.getElementById('menu-btn'),dr=document.getElementById('drawer'),bg=document.getElementById('drawer-bg');
      const op=()=>{dr.classList.remove('translate-x-full');bg.classList.remove('opacity-0','pointer-events-none');document.body.style.overflow='hidden';};
      const cl=()=>{dr.classList.add('translate-x-full');bg.classList.add('opacity-0','pointer-events-none');document.body.style.overflow='';};
      mb.onclick=op;document.getElementById('drawer-close').onclick=cl;bg.onclick=cl;document.addEventListener('keydown',e=>{if(e.key==='Escape')cl();});
    }
    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const wa=c.contact?.whatsapp||'';
      const TIPO=LANG==='en'?{blusa:'Apparel & caps',print:'Print',bandeira:'Flag',prancha:'Surfboard',ambiente:'Interiors (architects)'}:{blusa:'Roupas e boné',print:'Quadro',bandeira:'Bandeira',prancha:'Prancha de surf',ambiente:'Ambientes (arquitetos)'};
      const MSG=LANG==='en'?{blusa:'Hi, I want the piece with the photo ',print:'Hi, I want the print with the photo ',bandeira:'Hi, I want the flag with the photo ',prancha:'Hi, I want the surfboard with the photo ',ambiente:'Hi, I\'m an architect/designer and want the print for a project with the photo '}:{blusa:'Olá, quero a peça com a foto ',print:'Olá, quero o quadro com a foto ',bandeira:'Olá, quero a bandeira com a foto ',prancha:'Olá, quero a prancha de surf com a foto ',ambiente:'Olá, sou arquiteto(a)/designer e quero o quadro para um projeto com a foto '};
      const ROOM=LANG==='en'?{sala:'Living room',quarto:'Bedroom',escritorio:'Office',jantar:'Dining room',hotel:'Hotel lobby'}:{sala:'Sala',quarto:'Quarto',escritorio:'Escritório',jantar:'Sala de jantar',hotel:'Lobby de hotel'};
      let selRoom='sala';
      const T={ title:LANG==='en'?'AI try-on':'Provador IA', badge:LANG==='en'?'AI preview':'Provador com IA',
        sub:LANG==='en'?'Pick a product and a photo — AI shows you the result before you order.':'Escolha um produto e uma foto — a IA mostra o resultado antes de você pedir.',
        step:LANG==='en'?'Now tap a photo to see it':'Agora toque numa foto para ver o resultado',
        buy:LANG==='en'?'I want this':'Quero esta', genby:LANG==='en'?'Original photo · AI-made scene':'Foto original · cenário por IA' };
      document.getElementById('h1').textContent=T.title; document.getElementById('t').textContent=T.title+' — Hugo Carmo';
      document.getElementById('badge').textContent=T.badge; document.getElementById('sub').textContent=T.sub; document.getElementById('step').textContent=T.step;
      document.getElementById('r-buylbl').textContent=T.buy;
      const fts=(c.photos||[]).filter(p=>p.section==='fotografias').sort((a,b)=>a.order-b.order);
      const capOf=p=>(LANG==='en'&&p.caption_en)?p.caption_en:(p.caption||'');
      // tipo pills
      const order=['blusa','print','bandeira','prancha','ambiente'];
      let selTipo=order.includes(params.get('tipo'))?params.get('tipo'):'blusa';
      if(ROOM[params.get('room')]) selRoom=params.get('room');
      let selPath=null, selCap='';
      const pillCls=on=>`px-4 py-1.5 rounded-full border border-white/20 text-sm ${on?'bg-white text-black':'text-white/80 hover:bg-white/10'} transition`;
      const renderRooms=()=>{ const w=document.getElementById('room-wrap'); const on=selTipo==='ambiente';
        w.classList.toggle('hidden',!on); w.classList.toggle('flex',on);
        document.getElementById('room-lbl').textContent=LANG==='en'?'Room':'Cômodo';
        document.getElementById('room-pills').innerHTML=Object.keys(ROOM).map(r=>`<button data-room="${r}" class="${pillCls(r===selRoom)}">${esc(ROOM[r])}</button>`).join('');
        document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',()=>{ selRoom=b.dataset.room; renderRooms(); reset(); })); };
      const renderPills=()=>{ document.getElementById('tipo-pills').innerHTML=order.map(tp=>`<button data-tp="${tp}" class="${pillCls(tp===selTipo)}">${esc(TIPO[tp])}</button>`).join('');
        document.querySelectorAll('[data-tp]').forEach(b=>b.addEventListener('click',()=>{ selTipo=b.dataset.tp; renderPills(); renderRooms(); reset(); })); };
      // trocar de tag NÃO regenera: limpa e pede uma nova foto, do zero
      function reset(){ selPath=null; selCap=''; curUrl=''; clearInterval(msgTimer); closeEditor();
        document.getElementById('result').classList.add('hidden');
        document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('ring-2','ring-white'));
        document.getElementById('step').textContent=T.step; }
      let curUrl='';
      renderPills(); renderRooms();
      // grid
      document.getElementById('grid').innerHTML=fts.map(p=>`<button class="thumb group relative rounded-lg overflow-hidden aspect-square bg-white/5" data-path="${esc(p.path)}" data-cap="${esc(capOf(p))}"><img src="${imgUrl(p.path)}" alt="${esc(capOf(p))}" loading="lazy" class="w-full h-full object-cover transition group-hover:scale-105"></button>`).join('');
      const waLink=()=>"https://api.whatsapp.com/send/?phone="+wa+"&text="+encodeURIComponent(MSG[selTipo]+'"'+selCap+'"'+(selTipo==='ambiente'?' ('+ROOM[selRoom]+')':'')+(ED.on?' ('+GARM[ED.g]+', '+CORN[ED.cor]+') '+shareUrl():''))+"&type=phone_number&app_absent=0";
      const MSGS=LANG==='en'?['Setting up the canvas…','Printing the artwork…','Almost there…']:['Preparando a arte…','Aplicando no produto…','Quase lá…'];
      let msgTimer=null;
      function generate(path, cap){
        if(selTipo==='blusa') return openEditor(path, cap);
        closeEditor();
        selPath=path; selCap=cap;
        const R=document.getElementById('result'); R.classList.remove('hidden');
        const img=document.getElementById('r-img'), load=document.getElementById('r-load'), err=document.getElementById('r-err');
        img.classList.add('hidden'); err.classList.add('hidden'); err.classList.remove('flex'); load.classList.remove('hidden'); load.classList.add('flex');
        document.getElementById('r-thumb').src=imgUrl(path);
        document.getElementById('r-cap').textContent=cap; document.getElementById('r-tag').textContent=TIPO[selTipo]+(selTipo==='ambiente'?' · '+ROOM[selRoom]:'')+' · '+T.genby;
        ['r-buy','r-share','r-dl'].forEach(id=>document.getElementById(id).classList.add('hidden'));
        R.scrollIntoView({behavior:'smooth',block:'start'});
        let mi=0; document.getElementById('r-msg').textContent=MSGS[0]; clearInterval(msgTimer); msgTimer=setInterval(()=>{ mi=(mi+1)%MSGS.length; document.getElementById('r-msg').textContent=MSGS[mi]; },3500);
        fetch('/api/mockup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path, tipo:selTipo, room:selRoom})})
          .then(async r=>{ const j=await r.json(); if(!r.ok) throw new Error(j.error||'erro'); return j; })
          .then(j=>{ if(selPath!==path) return; clearInterval(msgTimer); showResult(j.url);
            try{ gtag&&gtag('event','mockup_view',{tipo:selTipo,room:selTipo==='ambiente'?selRoom:'',cached:!!j.cached}); }catch(e){} })
          .catch(e=>{ if(selPath!==path) return; clearInterval(msgTimer); load.classList.add('hidden'); load.classList.remove('flex');
            err.classList.remove('hidden'); err.classList.add('flex');
            err.innerHTML=`<i data-lucide="alert-triangle" class="w-6 h-6 text-white/60"></i><p class="text-sm text-white/70">${esc(e.message)}</p><p class="text-xs text-white/40">${LANG==='en'?'Try another photo or come back soon.':'Tente outra foto ou volte em instantes.'}</p>`;
            if(window.lucide)lucide.createIcons(); });
      }
      // ---- resultado: mostrar + compartilhar + baixar ----
      const idOf=u=>(String(u).split('/').pop()||'').replace(/\.(png|jpg).*$/,'');
      const shareUrl=()=>location.origin+'/p/'+idOf(curUrl)+(LANG==='en'?'?lang=en':'');
      function showResult(url){
        curUrl=url;
        const img=document.getElementById('r-img'), load=document.getElementById('r-load');
        load.classList.add('hidden'); load.classList.remove('flex');
        img.src=url; img.alt=selCap; img.onload=()=>img.classList.remove('hidden');
        const buy=document.getElementById('r-buy'); buy.href=waLink();
        ['r-buy','r-share','r-dl'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
      }
      document.getElementById('r-sharelbl').textContent=LANG==='en'?'Share':'Compartilhar';
      document.getElementById('r-dllbl').textContent=LANG==='en'?'Download':'Baixar';
      const flash=(id,txt)=>{ const el=document.getElementById(id), old=el.textContent; el.textContent=txt; setTimeout(()=>el.textContent=old,2200); };
      document.getElementById('r-share').addEventListener('click', async ()=>{
        if(ED.on) edSave();
        if(!curUrl) return;
        const url=shareUrl(), title=(LANG==='en'?'Look what I created with ':'Olha o que eu criei com ')+'Hugo Carmo — '+selCap;
        try{ gtag&&gtag('event','mockup_share',{tipo:selTipo}); }catch(e){}

        ptrs.set(e.pointerId,toCv(e)); const pts=[...ptrs.values()], l=cur(); if(!gest||!l) return;
        if(gest.type==='pinch'&&pts.length>=2){ const [a,b]=pts; l.w=gest.w*Math.hypot(a.x-b.x,a.y-b.y)/gest.d; l.cx=gest.cx+(a.x+b.x)/2-gest.mx; l.cy=gest.cy+(a.y+b.y)/2-gest.my; }
        else if(gest.type==='resize'){ const p=pts[0]; l.w=gest.w*Math.hypot(p.x-l.cx,p.y-l.cy)/gest.d; }
        else if(gest.type==='move'){ const p=pts[0]; l.cx=gest.cx+p.x-gest.x; l.cy=gest.cy+p.y-gest.y; }
        redraw(); });
      const endPtr=e=>{ if(!ptrs.delete(e.pointerId)) return; if(ptrs.size) startGesture(); else gest=null; };
      cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
      cv.addEventListener('wheel',e=>{ if(!ED.a) return; const k=cur()?ED.sel:hitAt(toCv(e)); if(k<0) return; e.preventDefault(); if(k!==ED.sel){ ED.sel=k; renderEdCtrls(); } ED.L[k].w*=Math.exp(-e.deltaY*0.0015); redraw(); },{passive:false});
      async function openEditor(path, cap){
        selPath=path; selCap=cap; ED.on=true; edSaved=''; ED.L=[]; ED.sel=-1;
        const R=document.getElementById('result'); R.classList.remove('hidden');
        const img=document.getElementById('r-img'), load=document.getElementById('r-load'), err=document.getElementById('r-err');
        img.classList.add('hidden'); err.classList.add('hidden'); err.classList.remove('flex'); load.classList.remove('hidden'); load.classList.add('flex');
        document.getElementById('r-thumb').src=imgUrl(path); document.getElementById('r-msg').textContent=MSGS[0];
        document.getElementById('r-cap').textContent=cap;
        edCat=catOf(ED.g); edLayout(true); renderEdCtrls();
        R.scrollIntoView({behavior:'smooth',block:'start'});
        const tok=++ED.tok;
        try{ const [ph,a]=await Promise.all([loadImg(imgUrl(path)),pecaAssets(ED.g)]); if(tok!==ED.tok||selPath!==path) return;
          ED.a=a; const l={path,cap,img:ph}; applyDefaults(l); clampL(l); ED.L=[l]; ED.sel=0; syncSel(); renderEdCtrls();
          load.classList.add('hidden'); load.classList.remove('flex'); edShow(); draw(); edHint();
          ['r-buy','r-share','r-dl'].forEach(id=>document.getElementById(id).classList.remove('hidden')); }
        catch(e){ if(tok===ED.tok){ load.classList.add('hidden'); load.classList.remove('flex'); edError(); } }
        if(window.lucide) lucide.createIcons();
      }
      function closeEditor(){ ED.on=false; ED.tok++; cv.classList.add('hidden'); edLayout(false); }
      document.getElementById('r-buy').addEventListener('click',()=>{ if(ED.on) edSave(); });
      // ---- abrir uma criação compartilhada (?m=<id>) ----
      const mId=params.get('m');
      if(mId && /^[a-z0-9-]+__[a-z0-9-]+$/.test(mId)){
        const [pslug,variant]=mId.split('__');
        if(variant.startsWith('ambiente-')&&ROOM[variant.slice(9)]){ selTipo='ambiente'; selRoom=variant.slice(9); }
        else if(order.includes(variant)) selTipo=variant;
        else if(variant.startsWith('blusa-')) selTipo='blusa';
        renderPills(); renderRooms();
        const sl=p=>p.replace(/\.[a-z0-9]+$/i,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');
        const ph=(c.photos||[]).find(p=>sl(p.path)===pslug);
        selPath=ph?ph.path:null; selCap=ph?capOf(ph):'';
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('r-cap').textContent=selCap;
        document.getElementById('r-tag').textContent=TIPO[selTipo]+(selTipo==='ambiente'?' · '+ROOM[selRoom]:'')+' · '+T.genby;
        const ri=document.getElementById('r-img'), old=c.bucket_base+'/mockups/'+mId+'.png';
        ri.onerror=()=>{ ri.onerror=null; curUrl=old; ri.src=old; }; // criações antigas (antes da v2)
        showResult(c.bucket_base+'/mockups-v2/'+mId+'.jpg');
        document.getElementById('step').textContent=LANG==='en'?'Want your own? Pick a product and a photo below.':'Quer criar o seu? Escolha um produto e uma foto abaixo.';
      }
      // ---- deep link: /provador?foto=<path>&tipo=<tipo>&room=<cômodo> já abre com a foto escolhida (usado pela página da foto) ----
      const fParam=params.get('foto');
      if(fParam && !mId){ const ph=fts.find(p=>p.path===fParam); if(ph){ renderPills(); renderRooms();
        const th=[...document.querySelectorAll('.thumb')].find(b=>b.dataset.path===ph.path); if(th) th.classList.add('ring-2','ring-white');
        generate(ph.path, capOf(ph)); } }
      chrome(c); if(window.lucide)lucide.createIcons();
    }).catch(()=>{ chrome({}); if(window.lucide)lucide.createIcons(); });
  </script>
