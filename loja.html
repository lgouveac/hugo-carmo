<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title id="t">Loja — Hugo Carmo</title>
  <meta name="description" id="meta-desc" content="Loja de Hugo Carmo — prints fine art das fotografias (por tema), fotolivros, blusas e bandeiras. Tamanho personalizado, fechamento pelo WhatsApp.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" id="canonical" href="https://hugocarmo.com.br/loja">
  <link rel="alternate" hreflang="pt-BR" href="https://hugocarmo.com.br/loja">
  <link rel="alternate" hreflang="en" href="https://hugocarmo.com.br/en/loja">
  <link rel="alternate" hreflang="x-default" href="https://hugocarmo.com.br/loja">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hugo Carmo">
  <meta property="og:title" id="og-title" content="Loja — Hugo Carmo">
  <meta property="og:image" content="https://gobslzsggskllmhzasti.supabase.co/storage/v1/object/public/photos/og-card.jpg">
  <link rel="icon" type="image/png" href="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>body{font-family:'Inter',system-ui,sans-serif;background:#000}#loja-panel{transition:max-height .35s cubic-bezier(.4,0,.2,1)}</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <header class="sticky top-0 z-[1100] w-full px-6 md:px-12 py-4 flex items-center justify-between bg-black/70 backdrop-blur border-b border-white/10">
    <a href="/" id="lnk-home" class="font-mono tracking-[3px] text-lg">KINA</a>
    <button id="menu-btn" aria-label="Menu" class="w-11 h-11 rounded-full border border-white/20 flex items-center justify-center hover:bg-white/10"><i data-lucide="menu" class="w-5 h-5"></i></button>
  </header>
  <div id="drawer-bg" class="fixed inset-0 z-[1099] bg-black/60 opacity-0 pointer-events-none transition-opacity duration-300"></div>
  <aside id="drawer" class="fixed top-0 right-0 z-[1101] h-full w-[82%] max-w-sm bg-[#0b0b0a] border-l border-white/10 translate-x-full transition-transform duration-300 flex flex-col" aria-hidden="true">
    <div class="flex items-center justify-between px-6 py-5 border-b border-white/10"><span class="font-mono tracking-[3px] text-lg">KINA</span><button id="drawer-close" aria-label="Fechar menu" class="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <nav id="drawer-nav" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col"></nav>
    <div id="drawer-foot" class="px-6 py-5 border-t border-white/10 flex items-center justify-between gap-3"></div>
  </aside>

  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-8 py-12">
    <div class="text-center mb-8"><h1 id="h1" class="text-4xl md:text-6xl font-semibold tracking-tight mb-3">Loja</h1><p id="sub" class="text-white/70 max-w-2xl mx-auto"></p></div>

    <div class="flex justify-center mb-5">
      <button id="loja-toggle" aria-expanded="false" class="inline-flex items-center gap-2 px-5 py-2 rounded-full border border-white/25 text-sm text-white/90 hover:bg-white/10 transition"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i> <span id="lbl-filtrar">Filtrar</span> <i data-lucide="chevron-down" class="w-4 h-4 transition-transform" id="loja-chev"></i></button>
    </div>
    <div id="loja-panel" class="overflow-hidden" style="max-height:0">
      <div class="max-w-4xl mx-auto px-2 pb-8 space-y-5">
        <div><div class="text-xs uppercase tracking-widest text-white/40 mb-3" id="lbl-tipo">Tipo</div><div id="tipo-pills" class="flex flex-wrap gap-2"></div></div>
        <div><div class="text-xs uppercase tracking-widest text-white/40 mb-3" id="lbl-tema">Tema</div><div id="tema-pills" class="flex flex-wrap gap-2"></div></div>
      </div>
    </div>
    <p id="count" class="text-center text-white/50 text-sm mb-6"></p>

    <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5"></div>
    <p id="empty" class="text-center text-white/50 mt-10 hidden">—</p>
  </main>

  <footer class="w-full border-t border-white/10 py-8 px-4 md:px-16 text-center text-white/50 text-sm"><a href="/" id="lnk-foot" class="hover:text-white">© <span id="yr"></span> Hugo Carmo — Artista Visual</a></footer>

  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co",CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json";
    const LANG=(/^\/en(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get('lang')==='en')?'en':'pt';
    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const slugify=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    document.documentElement.lang=LANG==='en'?'en':'pt-BR';
    document.getElementById('yr').textContent=new Date().getFullYear();
    document.getElementById('canonical').href='https://hugocarmo.com.br'+(LANG==='en'?'/en/loja':'/loja');
    const params=new URLSearchParams(location.search);
    function chrome(c){
      const home=LANG==='en'?'/en':'/';
      const lh=document.getElementById('lnk-home'),lf=document.getElementById('lnk-foot'); if(lh)lh.href=home; if(lf)lf.href=home;
      const P=LANG==='en'
        ?[['/en','Photography'],['/en/temas','Themes'],['/en/cicloviagens','Journeys'],['/en/loja','Shop'],['/en/fotolivros','Photo books'],['/en/blog','Travel diary'],['/en/sobre','About'],['/en/faq','FAQ']]
        :[['/','Fotografias'],['/temas','Temas'],['/cicloviagens','Cicloviagens'],['/loja','Loja'],['/fotolivros','Fotolivros'],['/blog','Diário'],['/sobre','Sobre'],['/faq','FAQ']];
      const cur=(location.pathname.replace(/\/+$/,'')||'/');
      document.getElementById('drawer-nav').innerHTML=P.map(([h,l])=>`<a href="${h}" class="px-3 py-3 rounded-lg text-lg ${cur===h.replace(/\/+$/,'')?'bg-white/10 text-white':'text-white/80 hover:bg-white/5 hover:text-white'} transition">${l}</a>`).join('');
      const lang=LANG==='en'?'<a href="/" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">PT</a>':'<a href="/en" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">EN</a>';
      document.getElementById('drawer-foot').innerHTML=`<div class="flex items-center gap-3"><a href="${c.contact?.instagram_url||'#'}" target="_blank" rel="noopener" aria-label="Instagram" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a><a href="https://wa.me/${c.contact?.whatsapp||''}" target="_blank" rel="noopener" aria-label="WhatsApp" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><i data-lucide="message-circle" class="w-4 h-4"></i></a></div>${lang}`;
      const mb=document.getElementById('menu-btn'),dr=document.getElementById('drawer'),bg=document.getElementById('drawer-bg');
      const op=()=>{dr.classList.remove('translate-x-full');bg.classList.remove('opacity-0','pointer-events-none');document.body.style.overflow='hidden';};
      const cl=()=>{dr.classList.add('translate-x-full');bg.classList.add('opacity-0','pointer-events-none');document.body.style.overflow='';};
      mb.onclick=op;document.getElementById('drawer-close').onclick=cl;bg.onclick=cl;document.addEventListener('keydown',e=>{if(e.key==='Escape')cl();});
    }
    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const en=c.en||{};
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const wa=c.contact?.whatsapp||'';
      const T={ filtrar:LANG==='en'?'Filter':'Filtrar', tipo:LANG==='en'?'Type':'Tipo', tema:LANG==='en'?'Theme':'Tema', all:LANG==='en'?'All':'Todos', allf:LANG==='en'?'All':'Todas',
        title:LANG==='en'?'Shop':'Loja', sub:LANG==='en'?'Fine-art prints by theme, photo books, tees and flags — custom sizes, checkout via WhatsApp.':'Prints fine art por tema, fotolivros, blusas e bandeiras — tamanho personalizado, fechamento pelo WhatsApp.',
        from:LANG==='en'?'From':'A partir de', cta:LANG==='en'?'I want it':'Quero', prods:LANG==='en'?'products':'produtos', prod:LANG==='en'?'product':'produto' };
      document.getElementById('h1').textContent=T.title; document.getElementById('t').textContent=T.title+' — Hugo Carmo';
      document.getElementById('sub').textContent=T.sub;
      document.getElementById('lbl-filtrar').textContent=T.filtrar; document.getElementById('lbl-tipo').textContent=T.tipo; document.getElementById('lbl-tema').textContent=T.tema;
      const KICK=LANG==='en'?{print:'Fine-art print',blusa:'Tee',bandeira:'Flag',fotolivro:'Photo book'}:{print:'Print fine art',blusa:'Blusa',bandeira:'Bandeira',fotolivro:'Fotolivro'};
      const TIPO=LANG==='en'?{print:'Print',blusa:'Tee',bandeira:'Flag',fotolivro:'Photo book'}:{print:'Print',blusa:'Blusa',bandeira:'Bandeira',fotolivro:'Fotolivro'};
      const MSG=LANG==='en'?{print:'Hi, I\'m interested in the print: ',blusa:'Hi, I want the tee ',bandeira:'Hi, I want the flag ',fotolivro:'Hi, I want the photo book '}:{print:'Olá, tenho interesse no print: ',blusa:'Olá, quero a blusa ',bandeira:'Olá, quero a bandeira ',fotolivro:'Olá, quero o fotolivro '};
      const printPrice=LANG==='en'?'R$ 150':'R$ 150,00';
      const link=(tipo,title)=>"https://api.whatsapp.com/send/?phone="+wa+"&text="+encodeURIComponent(MSG[tipo]+title)+"&type=phone_number&app_absent=0";
      // ----- montar produtos -----
      const items=[];
      (c.photos||[]).filter(p=>p.section==='fotografias').sort((a,b)=>a.order-b.order).forEach(p=>{
        items.push({tipo:'print', temas:(p.temas||[]), img:imgUrl(p.path), title:(LANG==='en'&&p.caption_en)?p.caption_en:(p.caption||''), price:printPrice, from:true});
      });
      (c.fotolivros?.items||[]).forEach((p,i)=>{ const t=(LANG==='en'&&en.fotolivros&&en.fotolivros.items&&en.fotolivros.items[i])?{...p,...en.fotolivros.items[i]}:p;
        items.push({tipo:'fotolivro', temas:[], img:imgUrl(t.cover), title:t.title||'', price:t.price||'', from:false}); });
      (c.categorias?.items||[]).forEach((it,i)=>{ const t=(LANG==='en'&&en.categorias&&en.categorias.items&&en.categorias.items[i])?{...it,...en.categorias.items[i]}:it;
        const k=slugify(it.title); let tipo=k.includes('blus')?'blusa':(k.includes('bandeira')||k.includes('flag')?'bandeira':null);
        if(tipo) items.push({tipo, temas:[], img:imgUrl(it.image), title:t.title||'', price:'', from:false}); });
      // ----- render cards -----
      const card=p=>`<div class="prod-card bg-gradient-to-br from-white/5 via-black/20 to-black/40 border border-white/10 rounded-2xl overflow-hidden flex flex-col" data-tipo="${p.tipo}" data-tema="${(p.temas||[]).join(' ')}">
        <div class="aspect-square overflow-hidden"><img src="${esc(p.img)}" alt="${esc(p.title)}" loading="lazy" class="w-full h-full object-cover"></div>
        <div class="flex-1 flex flex-col px-4 py-3">
          <div class="text-[11px] uppercase tracking-wider text-white/40 mb-1">${KICK[p.tipo]}</div>
          <h3 class="text-sm font-semibold mb-2 leading-snug line-clamp-2">${esc(p.title)||'&nbsp;'}</h3>
          <div class="flex items-end justify-between mt-auto gap-2">
            ${p.price?`<span class="flex flex-col leading-tight">${p.from?`<span class="text-[11px] text-gray-400">${esc(T.from)}</span>`:''}<span class="text-sm font-medium">${esc(p.price)}</span></span>`:'<span></span>'}
            <a href="${link(p.tipo,p.title)}" target="_blank" rel="noopener" class="shrink-0 px-3 py-1.5 rounded-lg bg-white text-black text-xs font-semibold hover:bg-white/90 flex items-center gap-1.5"><i data-lucide="message-circle" class="w-3.5 h-3.5"></i> ${esc(T.cta)}</a>
          </div>
        </div></div>`;
      document.getElementById('grid').innerHTML=items.map(card).join('');
      // ----- pills -----
      const order=['print','blusa','bandeira','fotolivro'];
      const present=order.filter(tp=>items.some(p=>p.tipo===tp));
      const pill=(val,label,attr)=>`<button data-${attr}="${val}" class="filt-${attr} px-4 py-1.5 rounded-full border border-white/20 text-sm text-white/80 hover:bg-white/10 transition">${esc(label)}</button>`;
      document.getElementById('tipo-pills').innerHTML=pill('',''+T.all,'tipo')+present.map(tp=>pill(tp,TIPO[tp],'tipo')).join('');
      const temas=c.temas||[];
      document.getElementById('tema-pills').innerHTML=pill('',''+T.allf,'tema')+temas.map(t=>pill(t.slug,LANG==='en'?t.en:t.pt,'tema')).join('');
      // ----- filtro -----
      const cards=[...document.querySelectorAll('.prod-card')], countEl=document.getElementById('count');
      let selTipo=params.get('tipo')||'', selTema=params.get('tema')||'';
      const setOn=(b,on)=>{ b.classList.toggle('bg-white',on); b.classList.toggle('text-black',on); b.classList.toggle('text-white/80',!on); };
      function apply(){ let n=0;
        cards.forEach(cd=>{ const okT=!selTipo||cd.dataset.tipo===selTipo; const tl=(cd.dataset.tema||'').split(' ').filter(Boolean); const okTh=!selTema||tl.includes(selTema);
          const show=okT&&okTh; cd.style.display=show?'':'none'; if(show)n++; });
        countEl.textContent=n+' '+(n===1?T.prod:T.prods);
        document.querySelectorAll('.filt-tipo').forEach(b=>setOn(b,b.dataset.tipo===selTipo));
        document.querySelectorAll('.filt-tema').forEach(b=>setOn(b,b.dataset.tema===selTema));
        document.getElementById('empty').classList.toggle('hidden',n>0);
      }
      document.querySelectorAll('.filt-tipo').forEach(b=>b.addEventListener('click',()=>{selTipo=b.dataset.tipo;apply();syncPanel();}));
      document.querySelectorAll('.filt-tema').forEach(b=>b.addEventListener('click',()=>{selTema=b.dataset.tema;apply();syncPanel();}));
      // painel expansível
      const tp=document.getElementById('loja-panel'), tg=document.getElementById('loja-toggle'), ch=document.getElementById('loja-chev');
      const isOpen=()=>tp.style.maxHeight&&tp.style.maxHeight!=='0px';
      const syncPanel=()=>{ if(isOpen()) tp.style.maxHeight=tp.scrollHeight+'px'; };
      tg.addEventListener('click',()=>{ const o=isOpen(); tp.style.maxHeight=o?'0':tp.scrollHeight+'px'; tg.setAttribute('aria-expanded',String(!o)); if(ch)ch.style.transform=o?'':'rotate(180deg)'; });
      apply();
      if((selTipo||selTema)){ tp.style.maxHeight=tp.scrollHeight+'px'; tg.setAttribute('aria-expanded','true'); if(ch)ch.style.transform='rotate(180deg)'; }
      chrome(c); if(window.lucide)lucide.createIcons();
    }).catch(()=>{ document.getElementById('empty').classList.remove('hidden'); chrome({}); if(window.lucide)lucide.createIcons(); });
  </script>
</body>
</html>
