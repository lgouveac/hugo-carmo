      ['seo','hero','about','gallery','montagens','shop','cta','faq','blog','contact','newsletter'].forEach(k=>{ if(e[k]) c[k]={...(c[k]||{}),...e[k]}; });

      if(Array.isArray(e.products)&&Array.isArray(c.products)) c.products=c.products.map((p,i)=> e.products[i]?{...p,...e.products[i]}:p);
      if(e.fotolivros&&c.fotolivros){ c.fotolivros={...c.fotolivros,title:e.fotolivros.title||c.fotolivros.title,subtitle:e.fotolivros.subtitle||c.fotolivros.subtitle};

        : '<a href="/en" class="text-sm font-semibold border border-white/20 rounded px-3 py-1.5 hover:bg-white/10">EN</a>';
      document.getElementById('drawer-foot').innerHTML = `<div class="flex items-center gap-3">
        <a href="${c.contact?.instagram_url||'#'}" target="_blank" rel="noopener" aria-label="Instagram" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><i data-lucide="instagram" class="w-4 h-4"></i></a>
        <a href="https://wa.me/${c.contact?.whatsapp||''}" target="_blank" rel="noopener" aria-label="WhatsApp" class="w-9 h-9 flex items-center justify-center rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/10"><i data-lucide="message-circle" class="w-4 h-4"></i></a>
      </div>${langLink}`;
      // Home = só o mosaico de fotografias
      document.getElementById('sections').innerHTML = SECTIONS.fotografias();
      // Categorias (Blusas/Prints/Bandeiras) — troca interativa
      const catItems=(c.categorias?.items)||[];
      if(catItems.length){
        const setCat=i=>{ const it=catItems[i], info=document.getElementById('cat-info'), img=document.getElementById('cat-img'); if(!info) return;
          const wlink="https://api.whatsapp.com/send/?phone="+(c.contact?.whatsapp||'')+"&text="+encodeURIComponent((LANG==='en'?'Hi, I want to buy: ':'Olá, quero comprar: ')+it.title)+"&type=phone_number&app_absent=0";
          info.innerHTML=`<p class="text-white/80 leading-relaxed mb-6">${esc(it.desc||'')}</p><a href="${wlink}" target="_blank" rel="noopener" class="self-start inline-flex items-center gap-2 px-6 py-3 rounded-lg bg-white text-black font-semibold hover:bg-white/90">${LANG==='en'?'BUY':'COMPRAR'} →</a>`;
          if(img){ img.src=it.image?imgUrl(it.image):''; img.alt=it.title||''; }
          document.querySelectorAll('.cat-btn').forEach((b,bi)=>b.classList.toggle('bg-white/10',bi===i));
        };
        document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>setCat(+b.dataset.cat)));
        setCat(0);
      }
      // Galeria imersiva: painel expansível + filtro por tema + modo "na sua casa"
      const tpanel=document.getElementById('tema-panel'), ttoggle=document.getElementById('tema-toggle'), tchev=document.getElementById('tema-chev'), grid=document.getElementById('galeria-grid');
      const panelOpen=()=> tpanel && tpanel.style.maxHeight && tpanel.style.maxHeight!=='0px';
      const syncPanel=()=>{ if(panelOpen()) tpanel.style.maxHeight=tpanel.scrollHeight+'px'; };
      if(ttoggle&&tpanel){ ttoggle.addEventListener('click',()=>{ const open=panelOpen(); tpanel.style.maxHeight=open?'0':tpanel.scrollHeight+'px'; ttoggle.setAttribute('aria-expanded',String(!open)); if(tchev) tchev.style.transform=open?'':'rotate(180deg)'; }); }
      document.querySelectorAll('#galeria .tema-btn').forEach(b=>b.addEventListener('click',()=>{
        const t=b.dataset.tema;
        document.querySelectorAll('#galeria .tema-btn').forEach(x=>{ const on=x===b; x.classList.toggle('bg-white',on); x.classList.toggle('text-black',on); x.classList.toggle('text-white/80',!on); });
        document.querySelectorAll('#galeria .tema-fig').forEach(f=>{ const has=!t||(f.dataset.temas||'').split(' ').filter(Boolean).includes(t); f.style.display=has?'':'none'; });
        syncPanel();
      }));
      const wtoggle=document.getElementById('wall-toggle');
      if(wtoggle&&grid){ wtoggle.addEventListener('click',()=>{ wtoggle.classList.toggle('on'); grid.classList.toggle('wall'); syncPanel(); }); }
      // Drawer lateral + hambúrguer que surge após o primeiro scroll
      const menuBtn=document.getElementById('menu-btn'), drawer=document.getElementById('drawer'), drawerBg=document.getElementById('drawer-bg'), drawerClose=document.getElementById('drawer-close');
      if(menuBtn&&drawer){
        const openDrawer=()=>{ drawer.classList.remove('translate-x-full'); drawerBg.classList.remove('opacity-0','pointer-events-none'); drawer.setAttribute('aria-hidden','false'); menuBtn.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; };
        const closeDrawer=()=>{ drawer.classList.add('translate-x-full'); drawerBg.classList.add('opacity-0','pointer-events-none'); drawer.setAttribute('aria-hidden','true'); menuBtn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; };
        menuBtn.addEventListener('click',openDrawer); drawerClose.addEventListener('click',closeDrawer); drawerBg.addEventListener('click',closeDrawer);
        document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
        const reveal=()=>{ const past=window.scrollY>window.innerHeight*0.55; menuBtn.classList.toggle('opacity-0',!past); menuBtn.classList.toggle('-translate-y-2',!past); menuBtn.classList.toggle('pointer-events-none',!past); };
        window.addEventListener('scroll',reveal,{passive:true}); reveal();
      }
      // Footer
      document.getElementById('footer-copy').textContent = (new Date().getFullYear()) + ' ' + (c.footer?.text || 'Hugo Carmo');
      const insta = document.getElementById('footer-insta');
      insta.href = c.contact?.instagram_url || '#'; insta.title = c.contact?.instagram_label || 'Instagram';
      const wa = document.getElementById('footer-wa');
      if(wa) wa.href = "https://wa.me/"+(c.contact?.whatsapp||'')+"?text="+encodeURIComponent(c.contact?.whatsapp_msg||'Olá');
      const th = document.getElementById('footer-threads');
      if(th){ if(c.contact?.threads_url){ th.href=c.contact.threads_url; th.style.display=''; } else { th.style.display='none'; } }
      const nf = document.getElementById('nl-form');
      if(nf) nf.addEventListener('submit', async ev=>{ ev.preventDefault();
        const email=document.getElementById('nl-email').value; const msg=document.getElementById('nl-msg');
        msg.className='text-sm mt-3 h-5 text-white/60'; msg.textContent='…';
        try{ const rr=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,lang:LANG})});
          const d=await rr.json(); if(!rr.ok) throw new Error(d.error||'erro');
          msg.className='text-sm mt-3 h-5 text-emerald-400'; msg.textContent=c.newsletter?.success||'OK ✓'; nf.reset();
        }catch(err){ msg.className='text-sm mt-3 h-5 text-red-400'; msg.textContent=err.message; } });

      if(window.lucide) lucide.createIcons();
      gsap.utils.toArray('.fade-in').forEach((el,i)=>{ gsap.to(el,{opacity:1,y:0,scale:1,filter:"blur(0px)",delay:.15+i*.05,duration:1,ease:"power3.out"}); el.classList.add('visible'); });
      bindLightbox();
    }

    // Lightbox
    const modalBg=document.getElementById('modal-bg'), modalImg=document.getElementById('modal-img'), modalCap=document.getElementById('modal-caption');
    let zoomAnim=null;
    function openLightbox(src,cap){ modalImg.src=src; modalImg.alt=cap||''; modalCap.textContent=cap||''; modalBg.classList.remove('hidden'); modalBg.setAttribute('aria-hidden','false'); setTimeout(()=>modalImg.focus(),120); gsap.set(modalImg,{scale:1.01,opacity:0}); gsap.to(modalImg,{opacity:1,duration:.5,ease:"power2.out"}); if(zoomAnim)zoomAnim.kill(); zoomAnim=gsap.to(modalImg,{scale:1.1,x:'1vw',y:'-.5vw',duration:8,ease:"power1.inOut",yoyo:true,repeat:-1}); }
    function closeLightbox(){ gsap.to(modalImg,{opacity:0,scale:.98,y:20,duration:.28,ease:"power2.in",onComplete:()=>{ modalBg.classList.add('hidden'); modalBg.setAttribute('aria-hidden','true'); modalImg.src=''; if(zoomAnim)zoomAnim.kill(); }}); }
    function bindLightbox(){ document.querySelectorAll('[data-lightbox]').forEach(img=> img.addEventListener('click', ()=>openLightbox(img.src, img.getAttribute('data-caption')))); }
    document.getElementById('modal-close').addEventListener('click', closeLightbox);
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg) closeLightbox(); });
    modalImg.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e=>{ if(!modalBg.classList.contains('hidden') && (e.key==='Escape'||e.key==='Enter'||e.key===' ')) closeLightbox(); });

    fetch(CONTENT_URL + "?v=" + Date.now(), {cache:"no-store"})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(raw => render(LANG==='en' ? mergeEn(raw) : raw))
      .catch(err=>{ console.error("content load failed", err); document.getElementById('load-error').classList.remove('hidden'); });
  </script>
</body>
</html>
