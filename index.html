<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hugo Carmo — Artista Visual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio e obras do artista visual Hugo Carmo — fotografias do Brasil e do mundo.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .bw-img { cursor: pointer; transition: filter .35s cubic-bezier(.4,0,.2,1), box-shadow .4s cubic-bezier(.4,0,.2,1); }
    .card-clickable { transition: box-shadow .28s cubic-bezier(.4,0,.2,1), outline .22s; cursor: pointer; outline: 0; }
    .card-clickable:focus-visible, .group:hover .card-clickable { box-shadow: 0 0 0 2px #fff3, 0 6px 32px 0 #000c; outline: 2px solid #fff2; outline-offset: 2px; }
    .fade-in { opacity: 0; transform: translateY(30px) scale(.97); filter: blur(8px); }
    .visible { opacity: 1 !important; transform: none !important; filter: blur(0) !important; transition: all .7s cubic-bezier(.4,0,.2,1); }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.4) 50%, rgba(0,0,0,.8) 100%); z-index: 1; }
    .hero-content { position: relative; z-index: 2; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    .animate-marquee { animation: marquee 40s linear infinite; }
    @media (max-width: 640px) { .modal-img-fullscreen { max-width: 99vw; border-radius: .7rem; } }
  </style>
</head>
<body class="bg-black text-white antialiased min-h-screen flex flex-col">

  <!-- Hero -->
  <section class="relative w-full min-h-screen flex flex-col overflow-hidden">
    <div id="hero-marquee" class="absolute inset-0 w-full h-full flex overflow-hidden pointer-events-none select-none [mask-image:_linear-gradient(to_right,transparent_0,_black_128px,_black_calc(100%-128px),transparent_100%)] z-0"></div>
    <div class="hero-overlay"></div>
    <header class="hero-content w-full px-6 py-6 md:px-16 flex flex-col md:flex-row items-center justify-between gap-4 relative z-10">
      <div class="flex items-center gap-4">
        <img id="logo" src="" alt="Hugo Carmo" class="w-20 h-20 object-contain rounded-2xl">
      </div>
      <nav class="flex items-center gap-6">
        <a href="#galeria" class="text-white/80 hover:text-white transition text-sm font-medium">Fotografias</a>
        <a href="#montagens" class="text-white/80 hover:text-white transition text-sm font-medium">Montagens</a>
        <a href="#comprar-obras" class="text-white/80 hover:text-white transition text-sm font-medium">Comprar</a>
        <a href="#sobre" class="text-white/80 hover:text-white transition text-sm font-medium">Sobre</a>
      </nav>
    </header>
    <div class="hero-content flex-1 flex items-center justify-center w-full px-4 sm:px-8 py-8 md:py-16">
      <div class="w-full max-w-6xl mx-auto text-center">
        <h1 class="text-5xl md:text-7xl lg:text-8xl font-semibold tracking-tight mb-6 fade-in">
          <span id="hero-title1"></span>
          <span id="hero-title2" class="block bg-gradient-to-r from-white via-gray-300 to-gray-500 text-transparent bg-clip-text"></span>
        </h1>
        <p id="hero-subtitle" class="text-xl md:text-2xl text-white/80 mb-8 max-w-3xl mx-auto fade-in"></p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 fade-in">
          <a href="#comprar-obras" class="px-8 py-4 bg-white/10 border border-white/20 rounded-lg font-medium text-white hover:bg-white/20 transition text-lg flex items-center justify-center">
            <i data-lucide="arrow-down" class="w-5 h-5 inline-block mr-2"></i>
            <span id="hero-cta"></span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Shop -->
  <main class="flex-1 flex flex-col items-center w-full px-4 sm:px-8 py-16 max-w-6xl mx-auto">
    <div id="shop-head" class="mb-10 text-center w-full"></div>
    <section id="comprar-obras" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></section>
  </main>

  <!-- Galeria de Fotografias -->
  <section id="galeria" class="w-full max-w-6xl mx-auto px-4 sm:px-8 py-16 fade-in">
    <div class="mb-10 text-center">
      <h2 id="gallery-title" class="text-4xl md:text-6xl font-semibold tracking-tight mb-3"></h2>
      <p id="gallery-subtitle" class="text-white/70 max-w-2xl mx-auto"></p>
    </div>
    <div id="gallery-grid" class="columns-1 sm:columns-2 lg:columns-3 gap-4"></div>
  </section>

  <!-- Montagens -->
  <section id="montagens" class="w-full max-w-6xl mx-auto px-4 sm:px-8 pb-16 fade-in">
    <div class="mb-10 text-center">
      <h2 id="montagens-title" class="text-3xl md:text-5xl font-semibold tracking-tight mb-3"></h2>
      <p id="montagens-subtitle" class="text-white/70 max-w-2xl mx-auto"></p>
    </div>
    <div id="montagens-grid" class="columns-1 sm:columns-2 lg:columns-3 gap-4"></div>
  </section>

  <!-- CTA -->
  <section class="relative w-full my-16 fade-in">
    <div class="max-w-6xl mx-auto px-4 sm:px-8">
      <div class="relative rounded-2xl overflow-hidden bg-black py-24 sm:py-32 px-6">
        <img id="cta-bg" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40 scale-[1.6]">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
        <div class="relative text-center">
          <h2 id="cta-title" class="text-4xl md:text-5xl font-semibold tracking-tight text-white mb-4"></h2>
          <p id="cta-text" class="text-lg md:text-xl text-white/80 mb-8 max-w-2xl mx-auto"></p>
          <a id="cta-button" href="#" target="_blank" rel="noopener" class="px-8 py-4 bg-white text-black rounded-lg font-medium hover:bg-white/90 transition-transform hover:scale-105 text-lg inline-flex items-center gap-2 group">
            <span></span>
            <i data-lucide="arrow-right" class="w-5 h-5 transition-transform group-hover:translate-x-1"></i>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Sobre -->
  <section id="sobre" class="w-full max-w-3xl mx-auto px-4 sm:px-8 my-16 fade-in text-center">
    <h2 id="about-title" class="text-3xl md:text-4xl font-semibold tracking-tight mb-6"></h2>
    <p id="about-text" class="text-white/75 text-lg leading-relaxed"></p>
  </section>

  <!-- Exposições -->
  <section class="relative w-full my-16 fade-in">
    <div class="max-w-5xl mx-auto px-4 sm:px-8">
      <div class="relative rounded-2xl overflow-hidden bg-black py-24 sm:py-32 px-6 flex items-center justify-center min-h-[420px]">
        <img id="expo-bg" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-50 scale-125">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
        <div class="relative text-center w-full">
          <h2 id="expo-title" class="text-3xl md:text-5xl font-normal text-white mb-8 drop-shadow-lg"></h2>
          <ul id="expo-list" class="space-y-4 text-lg md:text-2xl text-white/90 font-medium max-w-2xl mx-auto"></ul>
        </div>
      </div>
    </div>
  </section>

  <footer class="w-full border-t border-white/10 pt-12 pb-6 px-4 md:px-16 flex flex-col md:flex-row items-center justify-between gap-4 text-white/60 text-sm">
    <div id="footer-copy"></div>
    <div class="flex items-center gap-4">
      <a id="footer-insta" href="#" target="_blank" rel="noopener" class="hover:text-white hover:bg-white/10 transition rounded px-3 py-1"></a>
    </div>
  </footer>

  <!-- Lightbox -->
  <div id="modal-bg" class="fixed inset-0 flex items-center justify-center hidden" aria-modal="true" aria-hidden="true" role="dialog" tabindex="-1" style="background: rgba(0,0,0,.92); z-index: 1000;">
    <button id="modal-close" class="absolute top-4 right-4 w-11 h-11 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 z-50" aria-label="Fechar">
      <i data-lucide="x" class="w-6 h-6 text-white"></i>
    </button>
    <figure class="flex flex-col items-center gap-3">
      <img id="modal-img" src="" alt="" class="modal-img-fullscreen max-w-[90vw] max-h-[85vh] object-contain rounded-lg" tabindex="0" />
      <figcaption id="modal-caption" class="text-white/70 text-sm"></figcaption>
    </figure>
  </div>

  <div id="load-error" class="hidden fixed inset-0 flex items-center justify-center text-center text-white/70 p-8" style="z-index:2000;background:#000">
    Não foi possível carregar o conteúdo do site. Tente recarregar a página.
  </div>

  <script>
    const SUPA = "https://gobslzsggskllmhzasti.supabase.co";
    const CONTENT_URL = SUPA + "/storage/v1/object/public/photos/content.json";
    const esc = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const imgUrl = (c, path) => /^https?:\/\//.test(path) ? path : (c.bucket_base + "/" + path);

    function render(c) {
      // Logo
      document.getElementById('logo').src = c.logo || '';
      // Hero
      document.getElementById('hero-title1').textContent = c.hero.title1 || '';
      document.getElementById('hero-title2').textContent = c.hero.title2 || '';
      document.getElementById('hero-subtitle').innerHTML = c.hero.subtitle || '';
      document.getElementById('hero-cta').textContent = c.hero.cta || 'Comprar obras';

      const fotos = c.photos.filter(p => p.section === 'fotografias').sort((a,b)=>a.order-b.order);
      const monts = c.photos.filter(p => p.section === 'montagens').sort((a,b)=>a.order-b.order);

      // Hero marquee (primeiras fotos)
      const marqueeImgs = fotos.slice(0,5);
      const strip = arrHidden => `<div class="flex-none flex animate-marquee space-x-4 pr-4"${arrHidden?' aria-hidden="true"':''}>` +
        marqueeImgs.map(p=>`<img src="${imgUrl(c,p.path)}" alt="" class="h-full max-h-[100vh] rounded-2xl object-cover opacity-70">`).join('') + `</div>`;
      document.getElementById('hero-marquee').innerHTML = marqueeImgs.length ? strip(false)+strip(true) : '';

      // Shop
      document.getElementById('shop-head').innerHTML =
        `<h2 class="text-4xl md:text-6xl font-semibold tracking-tight mb-3">${esc(c.shop?.title||'Comprar obras')}</h2>
         <p class="text-white/70 max-w-2xl mx-auto">${esc(c.shop?.subtitle||'')}</p>`;
      const wa = (c.contact?.whatsapp)||'';
      const waLink = "https://api.whatsapp.com/send/?phone="+wa+"&text="+encodeURIComponent(c.contact?.whatsapp_msg||'Olá')+"&type=phone_number&app_absent=0";
      document.getElementById('comprar-obras').innerHTML = (c.products||[]).map(p=>`
        <div class="group fade-in">
          <div class="card-clickable bg-gradient-to-br from-white/5 via-black/20 to-black/40 border border-white/10 rounded-2xl overflow-hidden shadow-xl flex flex-col relative">
            <div class="relative">
              <img src="${esc(p.image)}" alt="${esc(p.title)}" class="bw-img w-full h-64 object-cover" data-lightbox data-caption="${esc(p.title)}">
              ${p.stock?`<div class="absolute top-2 right-2 px-3 py-1 rounded-full bg-black/80 text-xs font-medium border border-white/10">${esc(p.stock)}</div>`:''}
            </div>
            <div class="flex-1 flex flex-col px-5 py-4">
              <h2 class="text-xl font-semibold tracking-tight mb-1">${esc(p.title)}</h2>
              <p class="text-gray-400 text-sm mb-2">${esc(p.subtitle)}</p>
              <div class="flex items-end justify-between mt-auto">
                <span class="flex flex-col"><span class="text-xs text-gray-400 leading-tight">A partir de</span><span class="text-lg font-medium">${esc(p.price)}</span></span>
                <a href="${p.whatsapp||waLink}" target="_blank" rel="noopener" class="px-4 py-2 rounded-lg bg-white/10 border border-white/20 font-semibold text-white transition hover:bg-white/20 flex items-center gap-2">
                  <i data-lucide="zap" class="w-4 h-4"></i> Mais infos
                </a>
              </div>
            </div>
          </div>
        </div>`).join('');

      // Galeria
      document.getElementById('gallery-title').textContent = c.gallery?.title || 'Fotografias';
      document.getElementById('gallery-subtitle').textContent = c.gallery?.subtitle || '';
      const figHTML = p => `
        <figure class="group card-clickable relative mb-4 break-inside-avoid overflow-hidden rounded-xl bg-white/5">
          <img src="${imgUrl(c,p.path)}" alt="${esc(p.caption)}" loading="lazy" data-lightbox data-caption="${esc(p.caption)}" class="bw-img w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]">
          ${p.caption?`<figcaption class="pointer-events-none absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 to-transparent px-4 pt-10 pb-3 text-sm text-white/90 opacity-0 translate-y-2 transition-all duration-300 group-hover:opacity-100 group-hover:translate-y-0">${esc(p.caption)}</figcaption>`:''}
        </figure>`;
      document.getElementById('gallery-grid').innerHTML = fotos.map(figHTML).join('');

      // Montagens
      document.getElementById('montagens-title').textContent = c.montagens?.title || 'Na sua parede';
      document.getElementById('montagens-subtitle').textContent = c.montagens?.subtitle || '';
      document.getElementById('montagens-grid').innerHTML = monts.map(figHTML).join('');
      document.getElementById('montagens').style.display = monts.length ? '' : 'none';

      // CTA
      const ctaBg = fotos[6] || fotos[0];
      if (ctaBg) document.getElementById('cta-bg').src = imgUrl(c, ctaBg.path);
      document.getElementById('cta-title').textContent = c.cta?.title || '';
      document.getElementById('cta-text').textContent = c.cta?.text || '';
      const ctaBtn = document.getElementById('cta-button');
      ctaBtn.href = waLink; ctaBtn.querySelector('span').textContent = c.cta?.button || 'Fale comigo';

      // Sobre
      document.getElementById('about-title').textContent = c.about?.title || 'Sobre';
      document.getElementById('about-text').textContent = c.about?.text || '';
      document.getElementById('sobre').style.display = (c.about?.text) ? '' : 'none';

      // Exposições
      const expoBg = fotos[0];
      if (expoBg) document.getElementById('expo-bg').src = imgUrl(c, expoBg.path);
      document.getElementById('expo-title').textContent = c.exposicoes?.title || 'Exposições';
      document.getElementById('expo-list').innerHTML = (c.exposicoes?.items||[]).map(e=>
        `<li>${esc(e.text)} <span class="text-white/70 font-normal">${esc(e.year)}</span>${e.note?`<br><span class="text-white/60 text-base">(${esc(e.note)})</span>`:''}</li>`).join('');

      // Footer
      document.getElementById('footer-copy').textContent = (new Date().getFullYear()) + ' Hugo Carmo';
      const insta = document.getElementById('footer-insta');
      insta.href = c.contact?.instagram_url || '#';
      insta.textContent = c.contact?.instagram_label || '';

      if (window.lucide) lucide.createIcons();
      // Animações
      gsap.utils.toArray('.fade-in').forEach((el,i)=>{ gsap.to(el,{opacity:1,y:0,scale:1,filter:"blur(0px)",delay:.2+i*.06,duration:1,ease:"power3.out"}); el.classList.add('visible'); });
      bindLightbox();
    }

    // Lightbox
    const modalBg = document.getElementById('modal-bg');
    const modalImg = document.getElementById('modal-img');
    const modalCap = document.getElementById('modal-caption');
    let zoomAnim = null;
    function openLightbox(src, cap){
      modalImg.src = src; modalImg.alt = cap||''; modalCap.textContent = cap||'';
      modalBg.classList.remove('hidden'); modalBg.setAttribute('aria-hidden','false');
      setTimeout(()=>modalImg.focus(),120);
      gsap.set(modalImg,{scale:1.01,opacity:0}); gsap.to(modalImg,{opacity:1,duration:.5,ease:"power2.out"});
      if (zoomAnim) zoomAnim.kill();
      zoomAnim = gsap.to(modalImg,{scale:1.1,x:'1vw',y:'-.5vw',duration:8,ease:"power1.inOut",yoyo:true,repeat:-1});
    }
    function closeLightbox(){
      gsap.to(modalImg,{opacity:0,scale:.98,y:20,duration:.28,ease:"power2.in",onComplete:()=>{
        modalBg.classList.add('hidden'); modalBg.setAttribute('aria-hidden','true'); modalImg.src=''; if(zoomAnim) zoomAnim.kill();
      }});
    }
    function bindLightbox(){
      document.querySelectorAll('[data-lightbox]').forEach(img=>{
        img.addEventListener('click', ()=> openLightbox(img.src, img.getAttribute('data-caption')));
      });
    }
    document.getElementById('modal-close').addEventListener('click', closeLightbox);
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg) closeLightbox(); });
    modalImg.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e=>{ if(!modalBg.classList.contains('hidden') && (e.key==='Escape'||e.key==='Enter'||e.key===' ')) closeLightbox(); });

    // Load
    fetch(CONTENT_URL + "?v=" + Date.now(), {cache:"no-store"})
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(err=>{ console.error("content load failed", err); document.getElementById('load-error').classList.remove('hidden'); });
  </script>
</body>
</html>
