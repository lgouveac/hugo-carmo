<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title id="t">Cicloviagem — Hugo Carmo</title>
  <meta name="description" id="meta-desc" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" id="canonical" href="https://hugocarmo.com.br/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hugo Carmo">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:url" id="og-url" content="">
  <meta property="og:image" id="og-image" content="">
  <link rel="icon" type="image/png" href="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>body{font-family:'Inter',system-ui,sans-serif;} .bw-img{cursor:pointer;}</style>
  <script type="application/ld+json" id="ld"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <header class="w-full px-6 md:px-16 py-6 flex items-center justify-between border-b border-white/10">
    <a id="lnk-home" href="/"><img src="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png" alt="Hugo Carmo" class="w-14 h-14 object-contain rounded-xl"></a>
    <a id="lnk-back" href="/" class="text-sm text-white/70 hover:text-white">← Cicloviagens</a>
  </header>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-8 py-12">
    <div id="head" class="text-center mb-10"></div>
    <div id="grid" class="columns-1 sm:columns-2 lg:columns-3 gap-4"><p class="text-white/50">Carregando…</p></div>
    <div id="cta" class="mt-14 text-center"></div>
  </main>

  <footer class="w-full border-t border-white/10 py-8 px-4 md:px-16 text-center text-white/50 text-sm">
    <a id="lnk-foot" href="/" class="hover:text-white">Hugo Carmo — Artista Visual</a>
  </footer>

  <div id="modal-bg" class="fixed inset-0 hidden items-center justify-center" style="background:rgba(0,0,0,.92);z-index:1000;">
    <button id="modal-close" class="absolute top-4 right-4 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-2xl">×</button>
    <img id="modal-img" src="" alt="" class="max-w-[92vw] max-h-[88vh] object-contain rounded-lg">
  </div>

  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co", CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json", SITE="https://hugocarmo.com.br";
    const LANG=(/^\/en(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get('lang')==='en')?'en':'pt';
    const TX={pt:{back:'← Cicloviagens',cta:'Quer uma destas obras na sua parede?',ctaBtn:'Ver as obras',notfound:'Cicloviagem não encontrada'},
              en:{back:'← Journeys',cta:'Want one of these artworks on your wall?',ctaBtn:'See the artworks',notfound:'Journey not found'}};
    const T=TX[LANG], HOMEBASE=LANG==='en'?'/en':'/', VBASE=LANG==='en'?'/en/viagem':'/viagem';
    document.documentElement.lang=LANG==='en'?'en':'pt-BR';
    document.getElementById('lnk-home').href=HOMEBASE;
    const lb=document.getElementById('lnk-back'); lb.href=HOMEBASE+'#cicloviagens'; lb.textContent=T.back;
    document.getElementById('lnk-foot').href=HOMEBASE;
    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const slugify=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    const locOf=cap=>{const p=String(cap||'').split(',').map(x=>x.trim()).filter(Boolean);if(!p.length)return '';if(/^\d{4}$/.test(p[p.length-1]))p.pop();return p[p.length-1]||'';};
    function slugFromUrl(){const q=new URLSearchParams(location.search).get('slug');if(q)return q;const parts=location.pathname.split('/').filter(Boolean);return parts[parts.length-1]||'';}

    const modal=document.getElementById('modal-bg'),mimg=document.getElementById('modal-img');
    function open(src){mimg.src=src;modal.classList.remove('hidden');modal.style.display='flex';gsap.fromTo(mimg,{opacity:0,scale:1.02},{opacity:1,scale:1,duration:.4});}
    function close(){modal.classList.add('hidden');modal.style.display='none';mimg.src='';}
    document.getElementById('modal-close').onclick=close; modal.onclick=e=>{if(e.target===modal||e.target===mimg)close();};
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const slug=slugFromUrl();
      const col=(c.collections||[]).find(x=>x.slug===slug);
      const photos=(c.photos||[]).filter(p=>p.section==='fotografias'&&slugify(locOf(p.caption))===slug);
      if(!col||!photos.length){ document.getElementById('head').innerHTML=`<h1 class="text-2xl font-semibold">${T.notfound}</h1><p class="mt-2"><a href="${HOMEBASE}#cicloviagens" class="underline">${T.back}</a></p>`; document.getElementById('grid').innerHTML=''; document.getElementById('t').textContent=T.notfound+" — Hugo Carmo"; return; }
      const title=col.title||slug, story=(LANG==='en'&&col.story_en)?col.story_en:(col.story||'');
      const cover=imgUrl(col.cover||photos[0].path);
      const url=SITE+VBASE+"/"+slug;
      const desc=story? story.slice(0,155) : (LANG==='en'?`Fine-art photography by Hugo Carmo from ${title}. Prints in custom sizes.`:`Fotografia fine art de Hugo Carmo em ${title}. Prints em tamanho personalizado.`);
      document.title=title+(LANG==='en'?" — Photography by Hugo Carmo":" — Fotografias de Hugo Carmo");
      document.getElementById('t').textContent=document.title;
      const set=(id,a,v)=>{const e=document.getElementById(id);if(e)e.setAttribute(a,v);};
      set('meta-desc','content',desc); set('canonical','href',url); set('og-url','content',url);
      set('og-title','content',title); set('og-desc','content',desc); set('og-image','content',cover);
      [['pt-br','/viagem/'],['en','/en/viagem/'],['x-default','/viagem/']].forEach(([h,b])=>{const l=document.createElement('link');l.rel='alternate';l.hreflang=h;l.href=SITE+b+slug;document.head.appendChild(l);});
      document.getElementById('ld').textContent=JSON.stringify({"@context":"https://schema.org","@type":"CollectionPage","name":title,"description":desc,"url":url,
        "inLanguage":LANG==='en'?'en':'pt-BR',"isPartOf":{"@type":"WebSite","name":"Hugo Carmo","url":SITE+"/"},
        "image":photos.slice(0,10).map(p=>imgUrl(p.path))});

      document.getElementById('head').innerHTML=`<h1 class="text-4xl md:text-6xl font-semibold tracking-tight mb-3">${esc(title)}</h1>${story?`<p class="text-white/70 max-w-2xl mx-auto leading-relaxed">${esc(story)}</p>`:''}`;
      document.getElementById('grid').innerHTML=photos.map(p=>`<figure class="mb-4 break-inside-avoid overflow-hidden rounded-xl bg-white/5"><img src="${imgUrl(p.path)}" alt="${esc(p.caption)}" loading="lazy" class="bw-img w-full object-cover hover:opacity-90 transition" data-full="${imgUrl(p.path)}"></figure>`).join('');
      document.querySelectorAll('#grid img').forEach(im=>im.addEventListener('click',()=>open(im.dataset.full)));
      document.getElementById('cta').innerHTML=`<div class="inline-block rounded-2xl border border-white/15 bg-white/5 p-6"><div class="text-lg font-semibold mb-3">${T.cta}</div><a href="${HOMEBASE}#comprar-obras" class="inline-block px-6 py-3 rounded-lg bg-white text-black font-medium hover:bg-white/90">${T.ctaBtn}</a></div>`;
    }).catch(()=>{ document.getElementById('grid').innerHTML='<p class="text-white/50">—</p>'; });
  </script>
</body>
</html>
