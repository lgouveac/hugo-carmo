<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title id="t">Diário de viagem — Hugo Carmo</title>
  <meta name="description" id="meta-desc" content="Diário de viagem do fotógrafo Hugo Carmo.">
  <meta name="keywords" id="meta-kw" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" id="canonical" href="https://hugocarmo.com.br/blog">
  <meta name="author" content="Hugo Carmo">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Hugo Carmo">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:url" id="og-url" content="">
  <meta property="og:image" id="og-image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" id="tw-image" content="">
  <link rel="icon" type="image/png" href="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body { font-family:'Inter',system-ui,sans-serif; }
    .prose-art p { margin: 0 0 1.1rem; line-height:1.75; color:#d4d4d8; }
    .prose-art h2 { font-size:1.6rem; font-weight:600; margin:2rem 0 .8rem; }
    .prose-art h3 { font-size:1.25rem; font-weight:600; margin:1.5rem 0 .6rem; }
    .prose-art a { color:#fff; text-decoration:underline; text-underline-offset:3px; }
    .prose-art strong { color:#fff; }
  </style>
  <script type="application/ld+json" id="ld-article"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <header class="w-full px-6 md:px-16 py-6 flex items-center justify-between border-b border-white/10">
    <a href="/"><img src="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png" alt="Hugo Carmo" class="w-14 h-14 object-contain rounded-xl"></a>
    <a href="/blog" class="text-sm text-white/70 hover:text-white">← Diário de viagem</a>
  </header>

  <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-8 py-12">
    <article id="article">
      <p class="text-white/50 text-sm">Carregando…</p>
    </article>
  </main>

  <footer class="w-full border-t border-white/10 py-8 px-4 md:px-16 text-center text-white/50 text-sm">
    <a href="/" class="hover:text-white">Hugo Carmo — Artista Visual</a>
  </footer>

  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co";
    const CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json";
    const SITE="https://hugocarmo.com.br";
    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const fmt=d=>{const p=String(d||'').split('-');return (p[2]&&p[1]&&p[0])?`${parseInt(p[2])} de ${MESES[parseInt(p[1])-1]} de ${p[0]}`:'';};
    function slugFromUrl(){ const q=new URLSearchParams(location.search).get('slug'); if(q) return q; const parts=location.pathname.split('/').filter(Boolean); return parts[parts.length-1]||''; }

    // Markdown-lite seguro (autor confiável, mas escapamos por garantia)
    function mdLite(text, imgUrlFn){
      const inline = t => esc(t)
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\((\/[^)\s]*|https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>');
      return String(text||'').split(/\n{2,}/).map(block=>{
        const b=block.trim();
        if(b.startsWith('### ')) return `<h3>${inline(b.slice(4))}</h3>`;
        if(b.startsWith('## ')) return `<h2>${inline(b.slice(3))}</h2>`;
        return `<p>${inline(b).replace(/\n/g,'<br>')}</p>`;
      }).join('');
    }

    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const slug=slugFromUrl();
      const posts=(c.blog&&c.blog.posts)||[];
      const post=posts.find(p=>p.slug===slug);
      const art=document.getElementById('article');
      if(!post){ art.innerHTML=`<h1 class="text-2xl font-semibold mb-3">Post não encontrado</h1><p class="text-white/60"><a href="/blog" class="underline">Voltar para o Diário de viagem</a></p>`; document.getElementById('t').textContent="Post não encontrado — Hugo Carmo"; return; }

      const url=SITE+"/blog/"+post.slug;
      const cover=imgUrl(post.cover);
      const desc=post.excerpt||'';
      // SEO
      document.title=post.title+" — Hugo Carmo";
      document.getElementById('t').textContent=document.title;
      const set=(id,attr,v)=>{const el=document.getElementById(id); if(el) el.setAttribute(attr,v);};
      set('meta-desc','content',desc); set('meta-kw','content',post.keywords||'');
      set('canonical','href',url); set('og-url','content',url);
      set('og-title','content',post.title); set('og-desc','content',desc);
      set('og-image','content',cover); set('tw-image','content',cover);
      document.getElementById('ld-article').textContent=JSON.stringify({
        "@context":"https://schema.org","@type":"BlogPosting",
        "headline":post.title,"description":desc,"image":cover,
        "datePublished":post.date,"dateModified":post.date,
        "author":{"@type":"Person","name":"Hugo Carmo","url":SITE+"/"},
        "publisher":{"@type":"Person","name":"Hugo Carmo"},
        "mainEntityOfPage":{"@type":"WebPage","@id":url},
        "keywords":post.keywords||""
      });

      art.innerHTML=`
        <nav class="text-xs text-white/40 mb-6"><a href="/" class="hover:text-white">Início</a> › <a href="/blog" class="hover:text-white">Diário de viagem</a></nav>
        <h1 class="text-3xl md:text-5xl font-semibold tracking-tight leading-tight mb-3">${esc(post.title)}</h1>
        <div class="text-white/50 text-sm mb-8">${esc(fmt(post.date))}</div>
        <img src="${cover}" alt="${esc(post.title)}" class="w-full rounded-2xl mb-10 object-cover">
        <div class="prose-art text-lg">${mdLite(post.body, imgUrl)}</div>
        <div class="mt-12 rounded-2xl border border-white/15 bg-white/5 p-6 text-center">
          <div class="text-xl font-semibold mb-2">Quer uma obra dessas na sua parede?</div>
          <p class="text-white/65 mb-4">Prints e quadros fine art em tamanho personalizado.</p>
          <a href="/#comprar-obras" class="inline-block px-6 py-3 rounded-lg bg-white text-black font-medium hover:bg-white/90">Ver as obras</a>
        </div>`;
    }).catch(()=>{ document.getElementById('article').innerHTML='<p class="text-white/60">Não foi possível carregar o post.</p>'; });
  </script>
</body>
</html>
