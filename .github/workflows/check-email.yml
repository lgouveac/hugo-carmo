name: Debug - status de e-mail (Resend)

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'ID do e-mail no Resend'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar status
        run: |
          curl -s -H "Authorization: Bearer $RESEND_API_KEY" "https://api.resend.com/emails/${{ inputs.id }}" | node -e '
            let d="";
            process.stdin.on("data", c => d += c);
            process.stdin.on("end", () => {
              const j = JSON.parse(d);
              delete j.html; delete j.text;
              console.log(JSON.stringify(j, null, 2));
            });
          '
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
