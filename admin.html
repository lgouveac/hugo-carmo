<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin — Hugo Carmo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    input, textarea { background:#0b0b0b; }
    .tabbtn.active { background:#fff; color:#000; }
    .card { background:#111; border:1px solid #ffffff14; }
    ::placeholder { color:#ffffff55; }
  </style>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- LOGIN -->
  <div id="login" class="min-h-screen flex items-center justify-center px-4">
    <form id="login-form" class="w-full max-w-sm card rounded-2xl p-8 space-y-4">
      <h1 class="text-2xl font-semibold">Painel Hugo Carmo</h1>
      <p class="text-white/50 text-sm">Entre para editar o site.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="username"
             class="w-full rounded-lg border border-white/15 px-4 py-3 outline-none focus:border-white/40">
      <input id="password" type="password" placeholder="Senha" autocomplete="current-password" required
             class="w-full rounded-lg border border-white/15 px-4 py-3 outline-none focus:border-white/40">
      <button type="submit" class="w-full rounded-lg bg-white text-black font-semibold py-3 hover:bg-white/90">Entrar</button>
      <p id="login-error" class="text-red-400 text-sm hidden"></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="sticky top-0 z-30 bg-black/90 backdrop-blur border-b border-white/10 px-4 md:px-8 py-3 flex items-center gap-3 flex-wrap">
      <strong class="text-lg">Hugo Carmo · Admin</strong>
      <span id="dirty" class="text-amber-400 text-xs hidden">• alterações não salvas</span>
      <div class="ml-auto flex items-center gap-2">
        <a href="/" target="_blank" class="text-sm px-3 py-2 rounded-lg border border-white/15 hover:bg-white/10">Ver site ↗</a>
        <button id="save" class="text-sm px-4 py-2 rounded-lg bg-emerald-500 text-black font-semibold hover:bg-emerald-400">Salvar alterações</button>
        <button id="logout" class="text-sm px-3 py-2 rounded-lg border border-white/15 hover:bg-white/10">Sair</button>
      </div>
    </header>

    <nav class="px-4 md:px-8 pt-4 flex gap-2 flex-wrap">
      <button data-tab="textos"    class="tabbtn active px-4 py-2 rounded-lg border border-white/15 text-sm">Textos</button>
      <button data-tab="visual"    class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Visual</button>
      <button data-tab="secoes"    class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Seções</button>
      <button data-tab="fotografias" class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Fotografias</button>
      <button data-tab="montagens" class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Montagens</button>
      <button data-tab="blog"      class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Blog</button>
      <button data-tab="produtos"  class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Produtos</button>
      <button data-tab="categorias" class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Loja</button>
      <button data-tab="fotolivros" class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Fotolivros</button>
      <button data-tab="cicloviagens" class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Cicloviagens</button>
      <button data-tab="exposicoes" class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Exposições</button>
      <button data-tab="faq"       class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">FAQ</button>
      <button data-tab="contato"   class="tabbtn px-4 py-2 rounded-lg border border-white/15 text-sm">Contato</button>
    </nav>

    <main id="panel" class="px-4 md:px-8 py-6 max-w-5xl"></main>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-lg text-sm font-medium hidden z-50"></div>

  <script>
    const SUPA = "https://gobslzsggskllmhzasti.supabase.co";
    const CONTENT_URL = SUPA + "/storage/v1/object/public/photos/content.json";
    const TKEY = "hc_token";
    let content = null, dirty = false, currentTab = "textos";

    const $ = s => document.querySelector(s);
    const esc = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const token = () => localStorage.getItem(TKEY);
    const imgUrl = p => /^https?:\/\//.test(p) ? p : (content.bucket_base + "/" + p);
    function toast(msg, ok=true){ const t=$("#toast"); t.textContent=msg; t.className="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-lg text-sm font-medium z-50 "+(ok?"bg-emerald-500 text-black":"bg-red-500 text-white"); t.classList.remove("hidden"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add("hidden"),3000); }
    function setDirty(v){ dirty=v; $("#dirty").classList.toggle("hidden", !v); }

    // ---- Auth ----
    $("#login-form").addEventListener("submit", async e=>{
      e.preventDefault();
      $("#login-error").classList.add("hidden");
      try{
        const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email: $("#email").value, password: $("#password").value})});
        const d = await r.json();
        if(!r.ok) throw new Error(d.error||"Falha no login");
        localStorage.setItem(TKEY, d.token);
        await boot();
      }catch(err){ const el=$("#login-error"); el.textContent=err.message; el.classList.remove("hidden"); }
    });
    $("#logout").addEventListener("click", ()=>{ localStorage.removeItem(TKEY); location.reload(); });

    async function boot(){
      const r = await fetch(CONTENT_URL + "?v=" + Date.now(), {cache:"no-store"});
      content = await r.json();
      content.photos = content.photos || [];
      content.products = content.products || [];
      // Defaults para conteúdo antigo (compatibilidade)
      content.seo = content.seo || {title:"Hugo Carmo — Artista Visual", description:""};
      content.theme = content.theme || {accent:"#d1d5db", bg:"#000000"};
      content.footer = content.footer || {text:"Hugo Carmo"};
      content.backgrounds = content.backgrounds || {hero_mode:"gallery", hero_images:[], cta:"", expo:""};
      content.backgrounds.hero_images = content.backgrounds.hero_images || [];
      content.exposicoes = content.exposicoes || {title:"Exposições", items:[]};
      content.faq = content.faq || {title:"Perguntas frequentes", items:[]};
      content.blog = content.blog || {title:"Diário de viagem", subtitle:"", posts:[]};
      content.fotolivros = content.fotolivros || {title:"Fotolivros", subtitle:"", items:[]};
      content.collections = content.collections || [];
      content.categorias = content.categorias || {items:[]};
      content.en = content.en || {};
      content.en.categorias = content.en.categorias || {items:[]};
      { const ci=(content.categorias.items||[]); while(content.en.categorias.items.length < ci.length) content.en.categorias.items.push({}); }
      if(!content.sections || !content.sections.length) content.sections = [
        {key:"shop",label:"Comprar obras",visible:true},
        {key:"fotografias",label:"Fotografias",visible:true},
        {key:"montagens",label:"Na sua parede",visible:true},
        {key:"cta",label:"Chamada (CTA)",visible:true},
        {key:"sobre",label:"Sobre",visible:true},
        {key:"faq",label:"Perguntas frequentes",visible:true},
        {key:"exposicoes",label:"Exposições",visible:true},
      ];
      if(!content.sections.some(s=>s.key==="faq")){ const i=content.sections.findIndex(s=>s.key==="sobre"); content.sections.splice(i<0?content.sections.length:i+1,0,{key:"faq",label:"Perguntas frequentes",visible:true}); }
      if(!content.sections.some(s=>s.key==="blog")){ const i=content.sections.findIndex(s=>s.key==="montagens"); content.sections.splice(i<0?content.sections.length:i+1,0,{key:"blog",label:"Diário de viagem",visible:true}); }
      $("#login").classList.add("hidden");
      $("#app").classList.remove("hidden");
      renderTab(currentTab);
    }

    // ---- Tabs ----
    document.querySelectorAll(".tabbtn").forEach(b=> b.addEventListener("click", ()=>{
      document.querySelectorAll(".tabbtn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active"); currentTab=b.dataset.tab; renderTab(currentTab);
    }));

    function field(label, value, oninput, opts={}){
      const id = "f"+Math.random().toString(36).slice(2);
      const el = opts.textarea
        ? `<textarea id="${id}" rows="${opts.rows||4}" class="w-full rounded-lg border border-white/15 px-3 py-2 outline-none focus:border-white/40">${esc(value)}</textarea>`
        : `<input id="${id}" value="${esc(value)}" class="w-full rounded-lg border border-white/15 px-3 py-2 outline-none focus:border-white/40">`;
      setTimeout(()=>{ const node=document.getElementById(id); if(node) node.addEventListener("input", ev=>{ oninput(ev.target.value); setDirty(true); }); },0);
      return `<label class="block mb-4"><span class="block text-sm text-white/60 mb-1">${esc(label)}</span>${el}</label>`;
    }

    function renderTab(tab){
      const p = $("#panel");
      if(tab==="textos") p.innerHTML = tplTextos();
      else if(tab==="visual") p.innerHTML = tplVisual();
      else if(tab==="secoes") p.innerHTML = tplSecoes();
      else if(tab==="fotografias") p.innerHTML = tplPhotos("fotografias","Fotografias");
      else if(tab==="montagens") p.innerHTML = tplPhotos("montagens","Montagens (na sua parede)");
      else if(tab==="produtos") p.innerHTML = tplProdutos();
      else if(tab==="exposicoes") p.innerHTML = tplExpos();
      else if(tab==="faq") p.innerHTML = tplFaq();
      else if(tab==="blog") p.innerHTML = tplBlog();
      else if(tab==="categorias") p.innerHTML = tplCategorias();
      else if(tab==="fotolivros") p.innerHTML = tplFotolivros();
      else if(tab==="cicloviagens") p.innerHTML = tplCicloviagens();
      else if(tab==="contato") p.innerHTML = tplContato();
      bindFields();
    }

    // ---- TEXTOS ----
    let textosLang='pt';
    function tplTextos(){
      const c=content;
      const isEn = textosLang==='en';
      if(isEn){ c.en=c.en||{}; ['hero','gallery','montagens','shop','cta','about'].forEach(k=>c.en[k]=c.en[k]||{}); }
      const O = k => isEn ? c.en[k] : c[k];
      const mk = (o,k)=> isEn ? (v=>{ if(v&&v.trim()){o[k]=v;} else {delete o[k];} }) : (v=>{o[k]=v;});
      const H=(t)=>`<h2 class="text-lg font-semibold mt-6 mb-3 text-white/90">${t}</h2>`;
      const h=O('hero'), g=O('gallery'), m=O('montagens'), sh=O('shop'), ct=O('cta'), ab=O('about');
      const toggle=`<div class="flex items-center gap-2 mb-2">
        <button data-txlang="pt" class="px-3 py-1.5 rounded-lg text-sm border ${!isEn?'bg-white text-black border-white':'border-white/20 text-white/70 hover:bg-white/10'}">Português</button>
        <button data-txlang="en" class="px-3 py-1.5 rounded-lg text-sm border ${isEn?'bg-white text-black border-white':'border-white/20 text-white/70 hover:bg-white/10'}">English</button>
        ${isEn?'<span class="text-white/40 text-xs ml-2">Em branco = usa o texto em português.</span>':''}
      </div>`;
      return `<div class="card rounded-2xl p-5">
        ${toggle}
        ${H("Topo (hero)")}
        ${field("Título — linha 1", h.title1, mk(h,'title1'))}
        ${field("Título — linha 2 (destaque)", h.title2, mk(h,'title2'))}
        ${field("Subtítulo (aceita HTML, ex: <strong>)", h.subtitle, mk(h,'subtitle'), {textarea:true, rows:2})}
        ${field("Texto do botão", h.cta, mk(h,'cta'))}
        ${isEn?'':field("URL do logo", c.logo, v=>c.logo=v)}
        ${H("Seção Fotografias")}
        ${field("Título", g.title, mk(g,'title'))}
        ${field("Subtítulo", g.subtitle, mk(g,'subtitle'), {textarea:true, rows:2})}
        ${H("Seção Montagens")}
        ${field("Título", m.title, mk(m,'title'))}
        ${field("Subtítulo", m.subtitle, mk(m,'subtitle'), {textarea:true, rows:2})}
        ${H("Seção Comprar obras")}
        ${field("Título", sh.title, mk(sh,'title'))}
        ${field("Subtítulo", sh.subtitle, mk(sh,'subtitle'), {textarea:true, rows:2})}
        ${H("Chamada (CTA)")}
        ${field("Título", ct.title, mk(ct,'title'))}
        ${field("Texto", ct.text, mk(ct,'text'), {textarea:true, rows:2})}
        ${field("Texto do botão", ct.button, mk(ct,'button'))}
        ${H("Sobre")}
        ${field("Título", ab.title, mk(ab,'title'))}
        ${field("Texto", ab.text, mk(ab,'text'), {textarea:true, rows:6})}
      </div>`;
    }

    // ---- VISUAL ----
    function bgControl(label, key, current){
      const prev = current ? `<img src="${imgUrl(current)}" class="w-full h-32 object-cover rounded-lg bg-black mb-2">` : `<div class="w-full h-32 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-white/30 text-xs mb-2">usando imagem padrão</div>`;
      return `<div class="mb-5"><span class="block text-sm text-white/60 mb-1">${esc(label)}</span>${prev}
        <div class="flex gap-2">
          <label class="cursor-pointer text-xs px-3 py-1.5 rounded border border-white/15 hover:bg-white/10">Enviar imagem<input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" data-bgupload="${key}"></label>
          ${current?`<button data-bgclear="${key}" class="text-xs px-3 py-1.5 rounded border border-white/15 hover:bg-white/10">Usar padrão</button>`:''}
        </div></div>`;
    }
    function tplVisual(){
      const c=content, H=t=>`<h2 class="text-lg font-semibold mt-6 mb-3 text-white/90">${t}</h2>`;
      const heroCustom = (c.backgrounds.hero_mode==='custom');
      const heroThumbs = (c.backgrounds.hero_images||[]).map((p,i)=>`
        <div class="relative w-24 h-24"><img src="${imgUrl(p)}" class="w-24 h-24 object-cover rounded-lg bg-black">
          <button data-heroremove="${i}" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-500 text-white text-xs">×</button></div>`).join('');
      return `<div class="card rounded-2xl p-5">
        ${H("Logo")}
        <div class="flex items-center gap-4 mb-4">
          <img src="${esc(c.logo)}" class="w-16 h-16 object-contain rounded-lg bg-white/5">
          <label class="cursor-pointer text-sm px-3 py-2 rounded-lg border border-white/15 hover:bg-white/10">Enviar logo<input type="file" accept="image/png,image/jpeg,image/webp" class="hidden" data-logoupload></label>
        </div>
        ${field("URL do logo (ou envie acima)", c.logo, v=>c.logo=v)}

        ${H("Cores")}
        <div class="flex gap-6 mb-2">
          <label class="text-sm text-white/60">Cor de destaque<br><input type="color" value="${esc(c.theme.accent||'#d1d5db')}" data-theme="accent" class="mt-1 w-16 h-10 rounded bg-transparent border border-white/15"></label>
          <label class="text-sm text-white/60">Cor de fundo<br><input type="color" value="${esc(c.theme.bg||'#000000')}" data-theme="bg" class="mt-1 w-16 h-10 rounded bg-transparent border border-white/15"></label>
        </div>

        ${H("Fundo do topo (hero)")}
        <label class="block mb-3"><span class="block text-sm text-white/60 mb-1">Modo</span>
          <select data-heromode class="w-full rounded-lg border border-white/15 px-3 py-2 bg-black">
            <option value="gallery" ${!heroCustom?'selected':''}>Usar as primeiras fotos da galeria</option>
            <option value="custom" ${heroCustom?'selected':''}>Imagens personalizadas</option>
          </select></label>
        ${heroCustom?`<div class="flex flex-wrap gap-3 mb-2">${heroThumbs||'<span class="text-white/30 text-xs">Nenhuma imagem. Envie abaixo.</span>'}</div>
          <label class="cursor-pointer text-xs px-3 py-1.5 rounded border border-white/15 hover:bg-white/10">+ Adicionar imagem<input type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden" data-bgupload="hero"></label>`:''}

        ${H("Fundos de seção")}
        ${bgControl("Fundo da Chamada (CTA)", "cta", c.backgrounds.cta)}
        ${bgControl("Fundo das Exposições", "expo", c.backgrounds.expo)}

        ${H("SEO (Google / aba do navegador)")}
        ${field("Título da página", c.seo.title, v=>c.seo.title=v)}
        ${field("Descrição da página", c.seo.description, v=>c.seo.description=v, {textarea:true, rows:2})}
        <div class="mb-4">
          <span class="block text-sm text-white/60 mb-1">Imagem de compartilhamento (aparece no WhatsApp/Instagram ao enviar o link)</span>
          ${c.seo.og_image?`<img src="${esc(c.seo.og_image)}" class="w-full max-w-xs h-32 object-cover rounded-lg mb-2 bg-black">`:''}
          <label class="cursor-pointer text-xs px-3 py-1.5 rounded border border-white/15 hover:bg-white/10 inline-block">Enviar imagem<input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" data-ogupload></label>
        </div>

        ${H("Rodapé")}
        ${field("Texto do rodapé (nome ao lado do ano)", c.footer.text, v=>c.footer.text=v)}
      </div>`;
    }

    // ---- SEÇÕES (ordem + visibilidade) ----
    function tplSecoes(){
      const rows = content.sections.map((s,i)=>`
        <div class="card rounded-xl p-3 flex items-center gap-3" data-si="${i}">
          <div class="flex gap-1">
            <button data-secmove="up" data-i="${i}" class="px-2 py-1 rounded border border-white/15 text-xs hover:bg-white/10" ${i===0?'disabled style=opacity:.3':''}>↑</button>
            <button data-secmove="down" data-i="${i}" class="px-2 py-1 rounded border border-white/15 text-xs hover:bg-white/10" ${i===content.sections.length-1?'disabled style=opacity:.3':''}>↓</button>
          </div>
          <span class="flex-1 font-medium">${esc(s.label||s.key)}</span>
          <label class="flex items-center gap-2 text-sm text-white/70 cursor-pointer">
            <input type="checkbox" data-secvis="${i}" ${s.visible?'checked':''}> Mostrar
          </label>
        </div>`).join("");
      return `<div class="card rounded-2xl p-5">
        <h2 class="text-lg font-semibold mb-1">Seções do site</h2>
        <p class="text-white/50 text-sm mb-4">Arraste a ordem com ↑ ↓ e ligue/desligue cada seção. (O topo e o rodapé são fixos.)</p>
        <div class="space-y-2">${rows}</div>
      </div>`;
    }

    async function uploadFile(file){
      const buf = await file.arrayBuffer();
      const r = await fetch("/api/upload", {method:"POST", headers:{"Authorization":"Bearer "+token(), "Content-Type":file.type, "x-filename":file.name}, body: buf});
      const d = await r.json(); if(!r.ok) throw new Error(d.error||"falha"); return d;
    }

    // ---- PHOTOS (fotografias / montagens) ----
    function photosOf(section){ return content.photos.filter(p=>p.section===section).sort((a,b)=>a.order-b.order); }
    function nextOrder(section){ const l=photosOf(section); return l.length? Math.max(...l.map(p=>p.order))+1 : 1; }

    function tplPhotos(section, label){
      const list = photosOf(section);
      const cards = list.map((p,i)=>`
        <div class="card rounded-xl overflow-hidden flex flex-col" data-id="${esc(p.id)}">
          <img src="${imgUrl(p.path)}" class="w-full h-44 object-cover bg-black">
          <div class="p-3 space-y-2">
            <input value="${esc(p.caption)}" placeholder="Legenda (local, ano)" data-cap="${esc(p.id)}"
                   class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm outline-none focus:border-white/40">
            <input value="${esc(p.caption_en||'')}" placeholder="Legenda EN (opcional)" data-capen="${esc(p.id)}" class="w-full rounded-lg border border-white/10 px-2 py-1 text-xs outline-none focus:border-white/40 text-white/60">
            ${section==='fotografias'?`<input value="${esc((p.temas||[]).join(', '))}" placeholder="temas (ex: aguas, gente)" data-temas="${esc(p.id)}" class="w-full rounded-lg border border-white/10 px-2 py-1 text-xs outline-none focus:border-white/40 text-white/80">`:''}
            <div class="flex items-center justify-between gap-1">
              <div class="flex gap-1">
                <button data-move="up" data-id="${esc(p.id)}" class="px-2 py-1 rounded border border-white/15 text-xs hover:bg-white/10" ${i===0?'disabled style=opacity:.3':''}>↑</button>
                <button data-move="down" data-id="${esc(p.id)}" class="px-2 py-1 rounded border border-white/15 text-xs hover:bg-white/10" ${i===list.length-1?'disabled style=opacity:.3':''}>↓</button>
              </div>
              <button data-del="${esc(p.id)}" class="px-2 py-1 rounded border border-red-500/40 text-red-400 text-xs hover:bg-red-500/10">Remover</button>
            </div>
          </div>
        </div>`).join("");
      return `<div class="card rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
          <h2 class="text-lg font-semibold">${esc(label)} <span class="text-white/40 text-sm">(${list.length})</span></h2>
          <label class="cursor-pointer text-sm px-4 py-2 rounded-lg bg-white text-black font-semibold hover:bg-white/90">
            + Adicionar fotos
            <input type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden" data-upload="${section}">
          </label>
        </div>
        ${section==='fotografias'?`<p class="text-white/40 text-xs mb-3">Temas (separe por vírgula): ${(content.temas||[]).map(t=>t.slug).join(' · ')}</p>`:''}
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">${cards || '<p class="text-white/40 text-sm">Nenhuma foto ainda.</p>'}</div>
      </div>`;
    }

    // ---- PRODUTOS ----
    function tplProdutos(){
      const cards = content.products.map((p,i)=>`
        <div class="card rounded-xl p-3 flex gap-3" data-pi="${i}">
          <div class="w-28 shrink-0">
            <img src="${esc(p.image)}" class="w-28 h-28 object-cover rounded-lg bg-black">
            <label class="block mt-2 text-center cursor-pointer text-xs px-2 py-1 rounded border border-white/15 hover:bg-white/10">Trocar imagem
              <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" data-pimg="${i}"></label>
          </div>
          <div class="flex-1 grid grid-cols-2 gap-2">
            <input value="${esc(p.title)}" placeholder="Título" data-pf="title" data-pi="${i}" class="col-span-2 rounded-lg border border-white/15 px-2 py-1.5 text-sm">

    function tplBlog(){
      const posts=content.blog.posts||[];
      const cards=posts.map((p,i)=>`
        <div class="card rounded-xl p-3 space-y-2" data-bi="${i}">
          <div class="flex gap-3">
            <div class="w-28 shrink-0">
              <img src="${p.cover?imgUrl(p.cover):''}" class="w-28 h-20 object-cover rounded bg-black">
              <label class="block mt-1 text-center cursor-pointer text-xs px-2 py-1 rounded border border-white/15 hover:bg-white/10">Capa<input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" data-bcover="${i}"></label>

            <div class="flex-1 space-y-2">
              <input value="${esc(p.title)}" placeholder="Título do post" data-bf="title" data-bi="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">
              <div class="flex gap-2">

              </div>

          </div>
          <textarea rows="2" placeholder="Resumo (aparece na listagem e no Google)" data-bf="excerpt" data-bi="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">${esc(p.excerpt)}</textarea>
          <input value="${esc(p.keywords)}" placeholder="palavras-chave que vendem (separadas por vírgula)" data-bf="keywords" data-bi="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">
          <textarea rows="8" placeholder="Texto do post. Linha em branco separa parágrafos. ## subtítulo · **negrito** · [link](/#comprar-obras)" data-bf="body" data-bi="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">${esc(p.body)}</textarea>
          <div class="flex items-center justify-between">

        <div class="flex items-center justify-between mb-3 mt-2">
          <h2 class="text-sm text-white/60">Posts <span class="text-white/30">(palavras-chave = mais gente do Google)</span></h2>
          <button id="add-post" class="text-sm px-3 py-1.5 rounded-lg bg-white text-black font-semibold hover:bg-white/90">+ Novo post</button>
        </div>
        <div class="space-y-4">${cards||'<p class="text-white/40 text-sm">Nenhum post ainda.</p>'}</div>
      </div>`;
    }

    // ---- LOJA (categorias) ----
    function tplCategorias(){
      const items=(content.categorias?.items)||[];
      const enItems=(content.en?.categorias?.items)||[];
      const cards=items.map((it,i)=>{ const en=enItems[i]||{}; return `
        <div class="card rounded-xl p-3 flex gap-3" data-kati="${i}">
          <div class="w-28 shrink-0"><img src="${it.image?imgUrl(it.image):''}" class="w-28 h-28 object-cover rounded-lg bg-black">

          <div class="flex-1 space-y-2">
            <input value="${esc(it.title)}" placeholder="Título (PT)" data-katf="title" data-kati="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">
            <textarea rows="4" placeholder="Descrição (PT)" data-katf="desc" data-kati="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">${esc(it.desc)}</textarea>
            <input value="${esc(en.title)}" placeholder="Title (EN)" data-katenf="title" data-kati="${i}" class="w-full rounded-lg border border-white/10 px-2 py-1.5 text-sm text-white/80">
            <textarea rows="3" placeholder="Description (EN)" data-katenf="desc" data-kati="${i}" class="w-full rounded-lg border border-white/10 px-2 py-1.5 text-sm text-white/80">${esc(en.desc)}</textarea>

        <h2 class="text-lg font-semibold mb-1">Loja — categorias</h2>
        <p class="text-white/50 text-sm mb-4">Blusas, Prints, Bandeiras: edite título, descrição e imagem de cada uma. O botão COMPRAR leva ao WhatsApp com a categoria preenchida.</p>
        <div class="space-y-3">${cards||'<p class="text-white/40 text-sm">Nenhuma categoria.</p>'}</div>
      </div>`;
    }

    // ---- FOTOLIVROS ----

        <div class="card rounded-xl p-3 flex gap-3" data-li="${i}">
          <div class="w-28 shrink-0"><img src="${p.cover?imgUrl(p.cover):''}" class="w-28 h-28 object-cover rounded-lg bg-black">
            <label class="block mt-2 text-center cursor-pointer text-xs px-2 py-1 rounded border border-white/15 hover:bg-white/10">Capa<input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" data-lcover="${i}"></label></div>
          <div class="flex-1 grid grid-cols-2 gap-2">
            <input value="${esc(p.title)}" placeholder="Título" data-lf="title" data-li="${i}" class="col-span-2 rounded-lg border border-white/15 px-2 py-1.5 text-sm">
            <input value="${esc(p.subtitle)}" placeholder="Subtítulo" data-lf="subtitle" data-li="${i}" class="col-span-2 rounded-lg border border-white/15 px-2 py-1.5 text-sm">
            <input value="${esc(p.price)}" placeholder="Preço" data-lf="price" data-li="${i}" class="rounded-lg border border-white/15 px-2 py-1.5 text-sm">
            <div class="text-right"><button data-ldel="${i}" class="text-red-400 text-xs hover:underline">Remover</button></div>

        ${field("Subtítulo", f.subtitle, v=>content.fotolivros.subtitle=v, {textarea:true, rows:2})}
        <div class="flex items-center justify-between mb-3 mt-2"><h2 class="text-sm text-white/60">Livros</h2>
          <button id="add-livro" class="text-sm px-3 py-1.5 rounded-lg bg-white text-black font-semibold hover:bg-white/90">+ Livro</button></div>
        <div class="space-y-3">${cards||'<p class="text-white/40 text-sm">Nenhum livro.</p>'}</div>
      </div>`;
    }

    // ---- CICLOVIAGENS ----
    function tplCicloviagens(){
      const cols=content.collections||[];
      const rows=cols.map((col,i)=>`
        <div class="card rounded-xl p-3 space-y-2" data-ci="${i}">
          <div class="flex items-center gap-2">
            <div class="flex gap-1">
              <button data-cmove="up" data-i="${i}" class="px-2 py-1 rounded border border-white/15 text-xs hover:bg-white/10" ${i===0?'disabled style=opacity:.3':''}>↑</button>
              <button data-cmove="down" data-i="${i}" class="px-2 py-1 rounded border border-white/15 text-xs hover:bg-white/10" ${i===cols.length-1?'disabled style=opacity:.3':''}>↓</button>
            </div>
            <span class="text-white/40 text-xs">/${esc(col.slug)}</span>
            <label class="ml-auto flex items-center gap-2 text-sm text-white/70 cursor-pointer"><input type="checkbox" data-cvis="${i}" ${col.visible!==false?'checked':''}> Mostrar</label>
            <a href="/viagem/${esc(col.slug)}" target="_blank" class="text-xs px-2 py-1 rounded border border-white/15 hover:bg-white/10">Ver ↗</a>
          </div>
          <input value="${esc(col.title)}" placeholder="Título da viagem" data-cf="title" data-ci="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">
          <textarea rows="2" placeholder="História da viagem (PT)" data-cf="story" data-ci="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">${esc(col.story)}</textarea>
          <textarea rows="2" placeholder="Story (EN)" data-cf="story_en" data-ci="${i}" class="w-full rounded-lg border border-white/15 px-2 py-1.5 text-sm">${esc(col.story_en)}</textarea>

      return `<div class="card rounded-2xl p-5">

        <div class="space-y-3">${rows||'<p class="text-white/40 text-sm">Nenhuma coleção.</p>'}</div>
      </div>`;

    // ---- CONTATO ----
    function tplContato(){
      const c=content.contact;
      return `<div class="card rounded-2xl p-5">
        ${field("WhatsApp (só números, com DDI/DDD — ex: 5521999999999)", c.whatsapp, v=>c.whatsapp=v)}
        ${field("Mensagem padrão do WhatsApp", c.whatsapp_msg, v=>c.whatsapp_msg=v, {textarea:true, rows:2})}
        ${field("Instagram — texto exibido", c.instagram_label, v=>c.instagram_label=v)}
        ${field("Instagram — link", c.instagram_url, v=>c.instagram_url=v)}
      </div>`;
    }

    // ---- Event delegation (panel) ----
    function bindFields(){
      const panel = $("#panel");
      // captions
      panel.querySelectorAll("[data-cap]").forEach(inp=> inp.addEventListener("input", e=>{
        const ph = content.photos.find(p=>p.id===inp.dataset.cap); if(ph){ ph.caption=e.target.value; setDirty(true); }
      }));
      panel.querySelectorAll("[data-capen]").forEach(inp=> inp.addEventListener("input", e=>{
        const ph = content.photos.find(p=>p.id===inp.dataset.capen); if(ph){ const v=e.target.value.trim(); if(v) ph.caption_en=v; else delete ph.caption_en; setDirty(true); }
      }));
      panel.querySelectorAll("[data-txlang]").forEach(b=> b.addEventListener("click", ()=>{ textosLang=b.dataset.txlang; renderTab("textos"); }));
      panel.querySelectorAll("[data-temas]").forEach(inp=> inp.addEventListener("input", e=>{
        const ph = content.photos.find(p=>p.id===inp.dataset.temas); if(ph){ ph.temas=e.target.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); setDirty(true); }
      }));
      // move
      panel.querySelectorAll("[data-move]").forEach(btn=> btn.addEventListener("click", ()=>{
        movePhoto(btn.dataset.id, btn.dataset.move); renderTab(currentTab); setDirty(true);
      }));
      // delete photo
      panel.querySelectorAll("[data-del]").forEach(btn=> btn.addEventListener("click", ()=>{
        if(!confirm("Remover esta foto do site?")) return;
        content.photos = content.photos.filter(p=>p.id!==btn.dataset.del); renderTab(currentTab); setDirty(true);
      }));
      // upload photos
      panel.querySelectorAll("[data-upload]").forEach(inp=> inp.addEventListener("change", e=> uploadPhotos(e.target.files, inp.dataset.upload)));
      // products fields
      panel.querySelectorAll("[data-pf]").forEach(inp=> inp.addEventListener("input", e=>{
        content.products[+inp.dataset.pi][inp.dataset.pf]=e.target.value; setDirty(true);
      }));
      panel.querySelectorAll("[data-pdel]").forEach(btn=> btn.addEventListener("click", ()=>{
        if(!confirm("Remover este produto?")) return;
        content.products.splice(+btn.dataset.pdel,1); renderTab(currentTab); setDirty(true);
      }));
      panel.querySelectorAll("[data-pimg]").forEach(inp=> inp.addEventListener("change", e=> uploadProductImg(e.target.files[0], +inp.dataset.pimg)));
      const addP = panel.querySelector("#add-product");
      if(addP) addP.addEventListener("click", ()=>{ content.products.push({id:"p"+Date.now(),title:"Novo produto",subtitle:"",price:"R$ 0,00",stock:"",image:""}); renderTab(currentTab); setDirty(true); });
      // expos
      panel.querySelectorAll("[data-ef]").forEach(inp=> inp.addEventListener("input", e=>{
        content.exposicoes.items[+inp.dataset.ei][inp.dataset.ef]=e.target.value; setDirty(true);
      }));
      panel.querySelectorAll("[data-edel]").forEach(btn=> btn.addEventListener("click", ()=>{
        content.exposicoes.items.splice(+btn.dataset.edel,1); renderTab(currentTab); setDirty(true);
      }));
      const addE = panel.querySelector("#add-expo");
      if(addE) addE.addEventListener("click", ()=>{ (content.exposicoes.items=content.exposicoes.items||[]).push({text:"",year:"",note:""}); renderTab(currentTab); setDirty(true); });

      // ---- Visual ----
      panel.querySelectorAll("[data-theme]").forEach(inp=> inp.addEventListener("input", e=>{ content.theme[inp.dataset.theme]=e.target.value; setDirty(true); }));
      panel.querySelectorAll("[data-seo]").forEach(inp=> inp.addEventListener("input", e=>{ content.seo[inp.dataset.seo]=e.target.value; setDirty(true); }));
      const foot = panel.querySelector("[data-foot]");
      if(foot) foot.addEventListener("input", e=>{ content.footer.text=e.target.value; setDirty(true); });
      const logoUp = panel.querySelector("[data-logoupload]");
      if(logoUp) logoUp.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f) return; try{ toast("Enviando logo…"); const d=await uploadFile(f); content.logo=d.url; setDirty(true); renderTab(currentTab); toast("Logo trocado. Salve para publicar."); }catch(err){ toast("Erro: "+err.message,false); } });
      const ogUp = panel.querySelector("[data-ogupload]");
      if(ogUp) ogUp.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f) return; try{ toast("Enviando…"); const d=await uploadFile(f); content.seo.og_image=d.url; setDirty(true); renderTab(currentTab); toast("Imagem de compartilhamento definida. Salve para publicar."); }catch(err){ toast("Erro: "+err.message,false); } });
      const heroMode = panel.querySelector("[data-heromode]");
      if(heroMode) heroMode.addEventListener("change", e=>{ content.backgrounds.hero_mode=e.target.value; setDirty(true); renderTab(currentTab); });
      panel.querySelectorAll("[data-heroremove]").forEach(btn=> btn.addEventListener("click", ()=>{ content.backgrounds.hero_images.splice(+btn.dataset.heroremove,1); setDirty(true); renderTab(currentTab); }));
      panel.querySelectorAll("[data-bgupload]").forEach(inp=> inp.addEventListener("change", async e=>{
        const key=inp.dataset.bgupload, files=[...e.target.files]; if(!files.length) return;
        try{ toast("Enviando…");
          for(const f of files){ const d=await uploadFile(f); if(key==='hero') content.backgrounds.hero_images.push(d.path); else content.backgrounds[key]=d.path; }
          setDirty(true); renderTab(currentTab); toast("Imagem aplicada. Salve para publicar.");
        }catch(err){ toast("Erro: "+err.message,false); }
      }));
      panel.querySelectorAll("[data-bgclear]").forEach(btn=> btn.addEventListener("click", ()=>{ content.backgrounds[btn.dataset.bgclear]=""; setDirty(true); renderTab(currentTab); }));

      // ---- Seções ----
      panel.querySelectorAll("[data-secvis]").forEach(cb=> cb.addEventListener("change", e=>{ content.sections[+cb.dataset.secvis].visible=e.target.checked; setDirty(true); }));
      panel.querySelectorAll("[data-secmove]").forEach(btn=> btn.addEventListener("click", ()=>{
        const i=+btn.dataset.i, j=btn.dataset.secmove==='up'?i-1:i+1;
        if(j<0||j>=content.sections.length) return;
        const s=content.sections; [s[i],s[j]]=[s[j],s[i]]; setDirty(true); renderTab(currentTab);
      }));

      // ---- FAQ ----
      panel.querySelectorAll("[data-ff]").forEach(inp=> inp.addEventListener("input", e=>{ content.faq.items[+inp.dataset.fi][inp.dataset.ff]=e.target.value; setDirty(true); }));
      panel.querySelectorAll("[data-fdel]").forEach(btn=> btn.addEventListener("click", ()=>{ content.faq.items.splice(+btn.dataset.fdel,1); renderTab(currentTab); setDirty(true); }));
      const addF = panel.querySelector("#add-faq");
      if(addF) addF.addEventListener("click", ()=>{ (content.faq.items=content.faq.items||[]).push({q:"",a:""}); renderTab(currentTab); setDirty(true); });

      // ---- Blog ----
      panel.querySelectorAll("[data-bf]").forEach(inp=> inp.addEventListener("input", e=>{ content.blog.posts[+inp.dataset.bi][inp.dataset.bf]=e.target.value; setDirty(true); }));
      panel.querySelectorAll('[data-bf="title"]').forEach(inp=> inp.addEventListener("change", e=>{ const i=+inp.dataset.bi, p=content.blog.posts[i]; if(!p.slug){ p.slug=slugify(e.target.value); renderTab(currentTab); } }));
      panel.querySelectorAll("[data-bpub]").forEach(cb=> cb.addEventListener("change", e=>{ content.blog.posts[+cb.dataset.bpub].published=e.target.checked; setDirty(true); }));
      panel.querySelectorAll("[data-bdel]").forEach(btn=> btn.addEventListener("click", ()=>{ if(!confirm("Remover este post?"))return; content.blog.posts.splice(+btn.dataset.bdel,1); renderTab(currentTab); setDirty(true); }));
      panel.querySelectorAll("[data-bcover]").forEach(inp=> inp.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f)return; try{ toast("Enviando capa…"); const d=await uploadFile(f); content.blog.posts[+inp.dataset.bcover].cover=d.path; setDirty(true); renderTab(currentTab); toast("Capa definida. Salve para publicar."); }catch(err){ toast("Erro: "+err.message,false); } }));
      const addPost = panel.querySelector("#add-post");
      if(addPost) addPost.addEventListener("click", ()=>{ const today=new Date().toISOString().slice(0,10); content.blog.posts.unshift({id:"post"+Date.now(), slug:"", title:"Novo post", excerpt:"", keywords:"", cover:"", date:today, body:"", published:false}); renderTab(currentTab); setDirty(true); });

      // ---- Fotolivros ----
      panel.querySelectorAll("[data-lf]").forEach(inp=> inp.addEventListener("input", e=>{ content.fotolivros.items[+inp.dataset.li][inp.dataset.lf]=e.target.value; setDirty(true); }));
      panel.querySelectorAll("[data-ldel]").forEach(btn=> btn.addEventListener("click", ()=>{ if(!confirm("Remover este livro?"))return; content.fotolivros.items.splice(+btn.dataset.ldel,1); renderTab(currentTab); setDirty(true); }));
      panel.querySelectorAll("[data-lcover]").forEach(inp=> inp.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f)return; try{ toast("Enviando capa…"); const d=await uploadFile(f); content.fotolivros.items[+inp.dataset.lcover].cover=d.path; setDirty(true); renderTab(currentTab); toast("Capa definida. Salve."); }catch(err){ toast("Erro: "+err.message,false); } }));
      const addL = panel.querySelector("#add-livro");
      if(addL) addL.addEventListener("click", ()=>{ (content.fotolivros.items=content.fotolivros.items||[]).push({id:"livro"+Date.now(),title:"Novo livro",subtitle:"",cover:"",price:"R$ 0,00"}); renderTab(currentTab); setDirty(true); });

      // ---- Loja (categorias) ----
      panel.querySelectorAll("[data-katf]").forEach(inp=> inp.addEventListener("input", e=>{ content.categorias.items[+inp.dataset.kati][inp.dataset.katf]=e.target.value; setDirty(true); }));
      panel.querySelectorAll("[data-katimg]").forEach(inp=> inp.addEventListener("change", async e=>{ const f=e.target.files[0]; if(!f)return; try{ toast("Enviando…"); const d=await uploadFile(f); content.categorias.items[+inp.dataset.katimg].image=d.path; setDirty(true); renderTab(currentTab); toast("Imagem trocada. Salve."); }catch(err){ toast("Erro: "+err.message,false); } }));
      panel.querySelectorAll("[data-katenf]").forEach(inp=> inp.addEventListener("input", e=>{ const i=+inp.dataset.kati; content.en=content.en||{}; content.en.categorias=content.en.categorias||{items:[]}; while(content.en.categorias.items.length<=i) content.en.categorias.items.push({}); content.en.categorias.items[i][inp.dataset.katenf]=e.target.value; setDirty(true); }));

      // ---- Cicloviagens ----
      panel.querySelectorAll("[data-cf]").forEach(inp=> inp.addEventListener("input", e=>{ content.collections[+inp.dataset.ci][inp.dataset.cf]=e.target.value; setDirty(true); }));
      panel.querySelectorAll("[data-cvis]").forEach(cb=> cb.addEventListener("change", e=>{ content.collections[+cb.dataset.cvis].visible=e.target.checked; setDirty(true); }));
      panel.querySelectorAll("[data-cmove]").forEach(btn=> btn.addEventListener("click", ()=>{ const i=+btn.dataset.i, j=btn.dataset.cmove==='up'?i-1:i+1; const a=content.collections; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; a.forEach((x,k)=>x.order=k+1); setDirty(true); renderTab(currentTab); }));
    }

    function movePhoto(id, dir){
      const ph = content.photos.find(p=>p.id===id); if(!ph) return;
      const list = photosOf(ph.section);
      const idx = list.findIndex(p=>p.id===id);
      const swap = dir==="up" ? list[idx-1] : list[idx+1];
      if(!swap) return;
      const t = ph.order; ph.order = swap.order; swap.order = t;
    }

    async function uploadPhotos(files, section){
      if(!files || !files.length) return;
      toast("Enviando "+files.length+" foto(s)…");
      for(const f of files){
        try{
          const buf = await f.arrayBuffer();
          const r = await fetch("/api/upload", {method:"POST", headers:{"Authorization":"Bearer "+token(), "Content-Type":f.type, "x-filename":f.name}, body: buf});
          const d = await r.json();
          if(!r.ok) throw new Error(d.error||"falha");
          content.photos.push({id:d.path, path:d.path, caption:"", section, order: nextOrder(section)});
        }catch(err){ toast("Erro ao enviar "+f.name+": "+err.message, false); }
      }
      setDirty(true); renderTab(currentTab); toast("Fotos adicionadas. Não esqueça de Salvar.");
    }

    async function uploadProductImg(file, i){
      if(!file) return;
      try{
        toast("Enviando imagem…");
        const buf = await file.arrayBuffer();
        const r = await fetch("/api/upload", {method:"POST", headers:{"Authorization":"Bearer "+token(), "Content-Type":file.type, "x-filename":file.name}, body: buf});
        const d = await r.json();
        if(!r.ok) throw new Error(d.error||"falha");
        content.products[i].image = d.url;
        setDirty(true); renderTab(currentTab); toast("Imagem trocada. Não esqueça de Salvar.");
      }catch(err){ toast("Erro: "+err.message, false); }
    }

    // ---- Save ----
    $("#save").addEventListener("click", async ()=>{
      const btn=$("#save"); btn.disabled=true; const old=btn.textContent; btn.textContent="Salvando…";
      try{
        const r = await fetch("/api/save", {method:"POST", headers:{"Authorization":"Bearer "+token(), "Content-Type":"application/json"}, body: JSON.stringify(content)});
        const d = await r.json();
        if(!r.ok){ if(r.status===401){ toast("Sessão expirada, entre novamente.", false); localStorage.removeItem(TKEY); setTimeout(()=>location.reload(),1200); return; } throw new Error(d.error||"falha"); }
        content.version = d.version; setDirty(false); toast("Salvo! O site já está atualizado.");
      }catch(err){ toast("Erro ao salvar: "+err.message, false); }
      finally{ btn.disabled=false; btn.textContent=old; }
    });

    window.addEventListener("beforeunload", e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

    // ---- Init ----
    if(token()){ boot().catch(()=>{ /* token may be valid but show app anyway via public content */ }); }
  </script>
</body>
</html>
