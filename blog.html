<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Diário de viagem — Hugo Carmo</title>
  <meta name="description" content="Histórias e bastidores das ciclo-viagens do fotógrafo Hugo Carmo pelo Brasil — e as obras de fotografia fine art que nasceram delas.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://hugocarmo.com.br/blog">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hugo Carmo">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Diário de viagem — Hugo Carmo">
  <meta property="og:description" content="Histórias das ciclo-viagens pelo Brasil e as obras de fotografia que nasceram delas.">
  <meta property="og:url" content="https://hugocarmo.com.br/blog">
  <meta property="og:image" content="https://gobslzsggskllmhzasti.supabase.co/storage/v1/object/public/photos/og-card.jpg">
  <link rel="icon" type="image/png" href="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>body{font-family:'Inter',system-ui,sans-serif;}</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <header class="w-full px-6 md:px-16 py-6 flex items-center justify-between border-b border-white/10">
    <a href="/"><img src="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png" alt="Hugo Carmo" class="w-14 h-14 object-contain rounded-xl"></a>
    <a href="/" class="text-sm text-white/70 hover:text-white">← Voltar ao site</a>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-8 py-12">
    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-6xl font-semibold tracking-tight mb-3">Diário de viagem</h1>
      <p id="sub" class="text-white/70 max-w-2xl mx-auto"></p>
    </div>
    <div id="list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"><p class="text-white/50">Carregando…</p></div>
  </main>

  <footer class="w-full border-t border-white/10 py-8 px-4 md:px-16 text-center text-white/50 text-sm">
    <a href="/" class="hover:text-white">Hugo Carmo — Artista Visual</a>
  </footer>

  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co";
    const CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json";
    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const fmt=d=>{const p=String(d||'').split('-');return (p[2]&&p[1]&&p[0])?`${parseInt(p[2])} ${MESES[parseInt(p[1])-1]} ${p[0]}`:'';};
    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const b=c.blog||{}; document.getElementById('sub').textContent=b.subtitle||'';
      const posts=(b.posts||[]).filter(p=>p.published!==false).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      const list=document.getElementById('list');
      if(!posts.length){ list.innerHTML='<p class="text-white/50">Em breve, novos posts.</p>'; return; }
      list.innerHTML=posts.map(p=>`<a href="/blog/${esc(p.slug)}" class="group block rounded-2xl overflow-hidden border border-white/10 bg-white/5 hover:bg-white/10 transition">
        <div class="aspect-[16/10] overflow-hidden"><img src="${imgUrl(p.cover)}" alt="${esc(p.title)}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"></div>
        <div class="p-5"><div class="text-xs text-white/50 mb-2">${esc(fmt(p.date))}</div>
        <h2 class="text-lg font-semibold leading-snug mb-2">${esc(p.title)}</h2>
        <p class="text-sm text-white/65" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${esc(p.excerpt)}</p></div></a>`).join('');
      // JSON-LD Blog
      const ld=document.createElement('script'); ld.type='application/ld+json';
      ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Blog","name":"Diário de viagem — Hugo Carmo","url":"https://hugocarmo.com.br/blog",
        "blogPost":posts.map(p=>({"@type":"BlogPosting","headline":p.title,"url":"https://hugocarmo.com.br/blog/"+p.slug,"datePublished":p.date,"image":imgUrl(p.cover)}))});
      document.head.appendChild(ld);
    }).catch(()=>{ document.getElementById('list').innerHTML='<p class="text-white/50">Não foi possível carregar.</p>'; });
  </script>
</body>
</html>
