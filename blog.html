<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title id="t">Diário de viagem — Hugo Carmo</title>
  <meta name="description" id="meta-desc" content="Histórias e bastidores das ciclo-viagens do fotógrafo Hugo Carmo pelo Brasil — e as obras de fotografia fine art que nasceram delas.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" id="canonical" href="https://hugocarmo.com.br/blog">
  <link rel="alternate" hreflang="pt-BR" href="https://hugocarmo.com.br/blog">
  <link rel="alternate" hreflang="en" href="https://hugocarmo.com.br/en/blog">
  <link rel="alternate" hreflang="x-default" href="https://hugocarmo.com.br/blog">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hugo Carmo">
  <meta property="og:title" id="og-title" content="Diário de viagem — Hugo Carmo">
  <meta property="og:description" id="og-desc" content="Histórias das ciclo-viagens pelo Brasil e as obras de fotografia que nasceram delas.">
  <meta property="og:url" id="og-url" content="https://hugocarmo.com.br/blog">
  <meta property="og:image" content="https://gobslzsggskllmhzasti.supabase.co/storage/v1/object/public/photos/og-card.jpg">
  <link rel="icon" type="image/png" href="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>body{font-family:'Inter',system-ui,sans-serif;}</style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col">
  <header class="w-full px-6 md:px-16 py-6 flex items-center justify-between border-b border-white/10">
    <a id="lnk-home" href="/"><img src="https://neompzltxilcimodyvpd.supabase.co/storage/v1/object/public/flou//Captura%20de%20tela%202025-06-16%20224245.png" alt="Hugo Carmo" class="w-14 h-14 object-contain rounded-xl"></a>
    <a id="lnk-back" href="/" class="text-sm text-white/70 hover:text-white">← Voltar ao site</a>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-8 py-12">
    <div class="text-center mb-12">
      <h1 id="h1" class="text-4xl md:text-6xl font-semibold tracking-tight mb-3">Diário de viagem</h1>
      <p id="sub" class="text-white/70 max-w-2xl mx-auto"></p>
    </div>
    <div id="list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"><p class="text-white/50">Carregando…</p></div>
  </main>

  <footer class="w-full border-t border-white/10 py-8 px-4 md:px-16 text-center text-white/50 text-sm">
    <a id="lnk-foot" href="/" class="hover:text-white">Hugo Carmo — Artista Visual</a>
  </footer>

  <script>
    const SUPA="https://gobslzsggskllmhzasti.supabase.co";
    const CONTENT_URL=SUPA+"/storage/v1/object/public/photos/content.json";
    const LANG=(/^\/en(\/|$)/.test(location.pathname)||new URLSearchParams(location.search).get('lang')==='en')?'en':'pt';
    const TX={ pt:{title:'Diário de viagem',back:'← Voltar ao site',empty:'Em breve, novos posts.'},
               en:{title:'Travel diary',back:'← Back to site',empty:'New posts coming soon.'} };
    const T=TX[LANG], BLOGBASE=LANG==='en'?'/en/blog':'/blog', HOMEBASE=LANG==='en'?'/en':'/';
    document.documentElement.lang=LANG==='en'?'en':'pt-BR';
    document.getElementById('lnk-home').href=HOMEBASE;
    const lb=document.getElementById('lnk-back'); lb.href=HOMEBASE; lb.textContent=T.back;
    document.getElementById('lnk-foot').href=HOMEBASE;
    document.getElementById('h1').textContent=T.title;
    document.getElementById('t').textContent=T.title+" — Hugo Carmo";
    document.getElementById('canonical').href="https://hugocarmo.com.br"+BLOGBASE;
    document.getElementById('og-url').setAttribute('content',"https://hugocarmo.com.br"+BLOGBASE);

    const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const M_PT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const M_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmt=d=>{const p=String(d||'').split('-');if(!(p[2]&&p[1]&&p[0]))return '';const m=(LANG==='en'?M_EN:M_PT)[parseInt(p[1])-1];return LANG==='en'?`${m} ${parseInt(p[2])}, ${p[0]}`:`${parseInt(p[2])} ${m} ${p[0]}`;};

    fetch(CONTENT_URL+"?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(c=>{
      const imgUrl=p=>/^https?:\/\//.test(p)?p:(c.bucket_base+"/"+p);
      const b=c.blog||{};
      document.getElementById('sub').textContent=(LANG==='en'&&b.en?.subtitle)?b.en.subtitle:(b.subtitle||'');
      const posts=(b.posts||[]).filter(p=>p.published!==false).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      const list=document.getElementById('list');
      if(!posts.length){ list.innerHTML=`<p class="text-white/50">${T.empty}</p>`; return; }
      list.innerHTML=posts.map(p=>{ const tp=(LANG==='en'&&p.en)?p.en:p; return `<a href="${BLOGBASE}/${esc(p.slug)}" class="group block rounded-2xl overflow-hidden border border-white/10 bg-white/5 hover:bg-white/10 transition">
        <div class="aspect-[16/10] overflow-hidden"><img src="${imgUrl(p.cover)}" alt="${esc(tp.title)}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"></div>
        <div class="p-5"><div class="text-xs text-white/50 mb-2">${esc(fmt(p.date))}</div>
        <h2 class="text-lg font-semibold leading-snug mb-2">${esc(tp.title)}</h2>
        <p class="text-sm text-white/65" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${esc(tp.excerpt)}</p></div></a>`; }).join('');
    }).catch(()=>{ document.getElementById('list').innerHTML='<p class="text-white/50">—</p>'; });
  </script>
</body>
</html>
